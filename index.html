<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRT 2 PWA</title>
    <!-- Tailwind CSS (Solid Colors, No Blur) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: '#1e3a8a', secondary: '#3b82f6', bgdark: '#0f172a' } }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .gpu-transition { transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1); will-change: transform, opacity; }
        .hide { display: none !important; }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.85); /* Solid overlay, no backdrop-filter */ }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- APP CONTAINER -->
    <div id="app" class="max-w-md mx-auto h-screen bg-white relative overflow-hidden flex flex-col shadow-xl">
        
        <!-- 1. LANDING / LOGIN PAGE -->
        <div id="view-landing" class="absolute inset-0 z-50 bg-white flex flex-col items-center justify-center p-6 gpu-transition">
            <div class="w-24 h-24 bg-primary text-white rounded-full flex items-center justify-center text-3xl font-bold mb-6">SRT</div>
            <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">Portal SRT 2</h1>
            <p class="text-center text-sm text-gray-500 mb-8">"Cerdas Bersama, Tumbuh Setara"</p>

            <form id="login-form" class="w-full space-y-4">
                <input type="text" id="login-id" placeholder="NIP / NIW" class="w-full px-4 py-3 bg-gray-100 border-none rounded-lg focus:ring-2 focus:ring-primary outline-none" required>
                <input type="password" id="login-pass" placeholder="Password" class="w-full px-4 py-3 bg-gray-100 border-none rounded-lg focus:ring-2 focus:ring-primary outline-none">
                <button type="submit" class="w-full bg-primary text-white font-semibold py-3 rounded-lg shadow-md active:scale-95 transition-transform">Masuk Aplikasi</button>
            </form>

            <div class="my-6 flex items-center w-full">
                <hr class="flex-grow border-gray-200">
                <span class="px-3 text-sm text-gray-400">ATAU</span>
                <hr class="flex-grow border-gray-200">
            </div>

            <button type="button" onclick="App.QR.open()" class="w-full bg-gray-800 text-white font-semibold py-3 rounded-lg shadow-md flex justify-center items-center gap-2 active:scale-95 transition-transform">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                Masuk via QR
            </button>
        </div>

        <!-- 2. MAIN APP LAYOUT (Hidden until login) -->
        <div id="view-main" class="absolute inset-0 flex flex-col hide bg-gray-100 gpu-transition">
            
            <!-- HEADER -->
            <header class="bg-primary text-white p-4 flex justify-between items-center shadow-md shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center font-bold">SRT</div>
                    <div>
                        <h2 id="header-name" class="font-bold text-sm">Nama User</h2>
                        <p id="header-role" class="text-xs text-white/80">Role User</p>
                    </div>
                </div>
                <button type="button" onclick="App.Auth.logout()" class="p-2 text-white/80 active:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </header>

            <!-- SCROLLABLE CONTENT AREA -->
            <main id="content-area" class="flex-grow overflow-y-auto p-4 relative"></main>

            <!-- BOTTOM NAVIGATION -->
            <nav id="bottom-nav" class="bg-white border-t border-gray-200 flex justify-around p-2 pb-4 shrink-0 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
                <!-- Injected dynamically based on role -->
            </nav>

        </div>
    </div>

    <!-- MODAL CONTAINER -->
    <div id="modal-container" class="fixed inset-0 z-[100] modal-overlay flex items-end justify-center hide gpu-transition opacity-0">
        <div id="modal-content" class="bg-white w-full max-w-md max-h-[90vh] rounded-t-2xl overflow-y-auto flex flex-col shadow-2xl transform translate-y-full transition-transform duration-300">
            <!-- Modal header & body injected here -->
        </div>
    </div>

    <!-- MAIN JAVASCRIPT -->
    <script>
        const App = {
            Config: { API_URL: 'https://script.google.com/macros/s/AKfycby7ZrSlUDQT09EZmxXVf2Esdr2ViJ0d9O-AL1xlO3MI2s6RBCqbzpa4qY-kbqwJn1kT/exec' }, // Set dengan URL Apps Script
            State: {
                user: null,
                activeTab: 'dashboard',
                mockData: { // Digunakan sebelum backend siap
                    siswa: [{nisn:"111", nama:"Budi Santoso", kelas:"X-A"}, {nisn:"222", nama:"Siti Aminah", kelas:"X-B"}],
                    barang: [
                        {id:"B01", kat:"Elektronik", nama:"Proyektor", stok: 4, tersedia: 4},
                        {id:"B02", kat:"ATK", nama:"Kertas A4", stok: 20, tersedia: 20},
                        {id:"B03", kat:"Olahraga", nama:"Bola Basket", stok: 100, tersedia: 100} // Total 124
                    ]
                }
            },
            
            // LOGIKA OTENTIKASI & INIT
            Auth: {
                login: (e) => {
                    e.preventDefault();
                    // Mock Login (Nantinya diganti fetch ke Apps Script)
                    const id = document.getElementById('login-id').value;
                    App.State.user = { id: id, nama: "Bapak Guru", role: "Admin", jabatan: "Guru" };
                    App.UI.showMainApp();
                },
                logout: () => {
                    App.State.user = null;
                    document.getElementById('login-form').reset();
                    App.UI.hideMainApp();
                }
            },

            // LOGIKA UI UTAMA
            UI: {
                init: () => {
                    document.getElementById('login-form').addEventListener('submit', App.Auth.login);
                },
                showMainApp: () => {
                    document.getElementById('view-landing').classList.add('hide');
                    document.getElementById('view-main').classList.remove('hide');
                    document.getElementById('header-name').innerText = App.State.user.nama;
                    document.getElementById('header-role').innerText = App.State.user.role;
                    App.UI.renderNav();
                    App.UI.switchTab('dashboard');
                },
                hideMainApp: () => {
                    document.getElementById('view-landing').classList.remove('hide');
                    document.getElementById('view-main').classList.add('hide');
                },
                renderNav: () => {
                    const nav = document.getElementById('bottom-nav');
                    let html = '';
                    if(App.State.user.role === 'Admin' || App.State.user.role === 'Pegawai yang berwenang') {
                        const menus = [
                            {id: 'dashboard', icon: 'M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z', label: 'Dasbor'},
                            {id: 'absensi', icon: 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4', label: 'Absen'},
                            {id: 'alat', icon: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z', label: 'Alat'},
                            {id: 'data', icon: 'M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4', label: 'Data'},
                            {id: 'profil', icon: 'M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z', label: 'Profil'}
                        ];
                        menus.forEach(m => {
                            html += `<button type="button" onclick="App.UI.switchTab('${m.id}')" class="flex flex-col items-center p-2 text-gray-400 hover:text-primary nav-btn" data-tab="${m.id}">
                                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${m.icon}"></path></svg>
                                <span class="text-[10px] font-medium">${m.label}</span>
                            </button>`;
                        });
                    }
                    nav.innerHTML = html;
                },
                switchTab: (tabId) => {
                    App.State.activeTab = tabId;
                    // Update active state di nav
                    document.querySelectorAll('.nav-btn').forEach(btn => {
                        if(btn.dataset.tab === tabId) {
                            btn.classList.add('text-primary'); btn.classList.remove('text-gray-400');
                        } else {
                            btn.classList.add('text-gray-400'); btn.classList.remove('text-primary');
                        }
                    });
                    // Render Konten
                    const contentArea = document.getElementById('content-area');
                    if (App.Views[tabId]) {
                        contentArea.innerHTML = App.Views[tabId]();
                    } else {
                        contentArea.innerHTML = `<div class="p-6 text-center text-gray-500">View untuk ${tabId} belum tersedia.</div>`;
                    }
                }
            },

            // TAMPILAN VIEW TIAP TAB
            Views: {
                dashboard: () => {
                    // Kalkulasi Total Data Barang
                    const totalBarang = App.State.mockData.barang.reduce((sum, item) => sum + item.tersedia, 0);
                    
                    return `
                    <div class="space-y-4 fade-in">
                        <div class="bg-gradient-to-r from-primary to-secondary rounded-xl p-5 text-white shadow-lg">
                            <h3 class="text-lg font-bold mb-1">Ringkasan Hari Ini</h3>
                            <p class="text-sm opacity-90">Minggu, 20 September 2026</p>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                <p class="text-xs text-gray-500 font-medium uppercase">Siswa Absen</p>
                                <p class="text-2xl font-bold text-red-500 my-1">12</p>
                                <ul class="text-[10px] text-gray-400 list-disc pl-3"><li>Andi (Sakit)</li><li>Budi (Izin)</li></ul>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                <p class="text-xs text-gray-500 font-medium uppercase">Peminjaman</p>
                                <p class="text-2xl font-bold text-orange-500 my-1">3</p>
                                <ul class="text-[10px] text-gray-400 list-disc pl-3"><li>Proyektor (X-A)</li></ul>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                <p class="text-xs text-gray-500 font-medium uppercase">Izin Berjalan</p>
                                <p class="text-2xl font-bold text-blue-500 my-1">5</p>
                                <ul class="text-[10px] text-gray-400 list-disc pl-3"><li>Pulang Kampung</li></ul>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                <p class="text-xs text-gray-500 font-medium uppercase">Total Stok Barang</p>
                                <p class="text-2xl font-bold text-green-500 my-1">${totalBarang}</p>
                                <div class="text-[10px] text-gray-400 mt-1">Sesuai data gudang</div>
                            </div>
                        </div>
                    </div>`;
                },
                
                absensi: () => {
                    let listHtml = App.State.mockData.siswa.map((s, idx) => `
                        <div class="flex items-center justify-between p-3 bg-white mb-2 rounded-lg shadow-sm border border-gray-100">
                            <div>
                                <p class="font-bold text-sm text-gray-800">${s.nama}</p>
                                <p class="text-xs text-gray-500">${s.nisn} - Kelas ${s.kelas}</p>
                            </div>
                            <input type="checkbox" class="w-5 h-5 text-primary rounded border-gray-300 focus:ring-primary">
                        </div>
                    `).join('');

                    return `
                    <div class="h-full flex flex-col fade-in">
                        <button type="button" onclick="App.QR.open('absensi')" class="w-full bg-primary text-white p-4 rounded-xl shadow-md font-bold flex justify-center items-center gap-2 mb-4">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                            Mulai Scan QR Massal (Kamera)
                        </button>
                        
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-gray-700">Absen Manual</h3>
                            <label class="flex items-center gap-2 text-sm text-gray-600">
                                <input type="checkbox" id="check-all-absen" class="rounded text-primary"> Pilih Semua
                            </label>
                        </div>
                        
                        <input type="text" placeholder="Cari nama siswa..." class="w-full p-2 text-sm border rounded-lg mb-3 outline-none focus:border-primary">
                        
                        <div class="flex-grow overflow-y-auto pb-16">
                            ${listHtml}
                        </div>
                        <button class="fixed bottom-[80px] right-4 bg-secondary text-white px-6 py-3 rounded-full font-bold shadow-lg">Simpan Absen</button>
                    </div>`;
                },

                alat: () => {
                    const tools = [
                        {id: 'perizinan', title: 'Perizinan Siswa', icon: 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z'},
                        {id: 'peminjaman', title: 'Pinjam Barang', icon: 'M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z'},
                        {id: 'konseling', title: 'Konseling', icon: 'M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z'},
                        {id: 'info', title: 'Buat Info', icon: 'M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z'},
                        {id: 'pesan', title: 'Pesan ke Ortu', icon: 'M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z'}
                    ];
                    
                    return `
                    <div class="grid grid-cols-2 gap-3 fade-in">
                        ${tools.map(t => `
                            <button type="button" onclick="App.Modal.open('${t.id}')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 active:bg-gray-50 transition-colors">
                                <div class="w-12 h-12 bg-blue-50 text-primary rounded-full flex items-center justify-center">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${t.icon}"></path></svg>
                                </div>
                                <span class="font-medium text-sm text-gray-700">${t.title}</span>
                            </button>
                        `).join('')}
                    </div>`;
                },

                data: () => {
                    // Hanya mock Barang sebagai contoh
                    let html = `<h3 class="font-bold text-gray-700 mb-3">Master Data Barang</h3>`;
                    App.State.mockData.barang.forEach(b => {
                        html += `
                        <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-100 mb-2 flex justify-between items-center">
                            <div>
                                <p class="font-bold text-sm text-gray-800">${b.nama}</p>
                                <p class="text-xs text-gray-500">Kat: ${b.kat}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-lg font-bold text-primary">${b.tersedia}</p>
                                <p class="text-[10px] text-gray-400">Total: ${b.stok}</p>
                            </div>
                        </div>`;
                    });
                    return `<div class="fade-in">${html}</div>`;
                },

                profil: () => {
                    return `
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center fade-in">
                        <div class="w-20 h-20 bg-gray-200 rounded-full mx-auto mb-4 border-4 border-white shadow-md"></div>
                        <h2 class="text-xl font-bold text-gray-800">${App.State.user.nama}</h2>
                        <p class="text-sm text-gray-500 mb-6">${App.State.user.jabatan} - ${App.State.user.role}</p>
                        
                        <div class="space-y-3">
                            <button type="button" onclick="alert('Fungsi ganti password')" class="w-full bg-gray-100 text-gray-700 py-3 rounded-lg font-medium text-sm">Ganti Password</button>
                            <button type="button" onclick="alert('Fungsi cetak kartu')" class="w-full bg-primary/10 text-primary py-3 rounded-lg font-medium text-sm border border-primary/20">Cetak Kartu Login</button>
                        </div>
                    </div>`;
                }
            },

            // LOGIKA MODAL FORMULIR
            Modal: {
                open: (type) => {
                    const c = document.getElementById('modal-container');
                    const m = document.getElementById('modal-content');
                    
                    let html = `<div class="p-4 border-b flex justify-between items-center sticky top-0 bg-white">
                        <h3 class="font-bold text-lg text-gray-800 capitalize">${type.replace('-', ' ')}</h3>
                        <button type="button" onclick="App.Modal.close()" class="p-1 bg-gray-100 rounded-full text-gray-500"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                    </div><div class="p-4">`;

                    if (type === 'perizinan') {
                        // Options Siswa
                        let optSiswa = App.State.mockData.siswa.map(s => `<option value="${s.nisn}">${s.nama} (${s.kelas})</option>`).join('');
                        html += `
                        <form onsubmit="App.Modal.submit(event, 'Izin Berhasil Diajukan')" class="space-y-4">
                            <div>
                                <label class="text-xs font-bold text-gray-600 block mb-1">Pilih Siswa (Bisa lebih dari 1)</label>
                                <select multiple class="w-full p-3 bg-gray-50 border rounded-lg text-sm h-24 outline-none">${optSiswa}</select>
                                <p class="text-[10px] text-gray-400 mt-1">*Tahan CTRL untuk pilih banyak (PC)</p>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="text-xs font-bold text-gray-600 block mb-1">Mulai</label><input type="datetime-local" class="w-full p-2 bg-gray-50 border rounded-lg text-sm" required></div>
                                <div><label class="text-xs font-bold text-gray-600 block mb-1">Kembali</label><input type="datetime-local" class="w-full p-2 bg-gray-50 border rounded-lg text-sm" required></div>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-gray-600 block mb-1">Keperluan</label>
                                <textarea class="w-full p-3 bg-gray-50 border rounded-lg text-sm" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-bold">Ajukan Izin ke Kepala UKSR</button>
                        </form>`;
                    }
                    else if (type === 'peminjaman') {
                        let optBarang = App.State.mockData.barang.map(b => `<option value="${b.id}">${b.nama} (Stok: ${b.tersedia})</option>`).join('');
                        html += `
                        <form onsubmit="App.Modal.submit(event, 'Peminjaman Diajukan ke Sarpras')" class="space-y-4">
                            <div><label class="text-xs font-bold text-gray-600 block mb-1">Pilih Barang</label><select class="w-full p-3 bg-gray-50 border rounded-lg text-sm">${optBarang}</select></div>
                            <div><label class="text-xs font-bold text-gray-600 block mb-1">Waktu Pengembalian</label><input type="datetime-local" class="w-full p-3 bg-gray-50 border rounded-lg text-sm" required></div>
                            <div><label class="text-xs font-bold text-gray-600 block mb-1">Tujuan Penggunaan</label><textarea class="w-full p-3 bg-gray-50 border rounded-lg text-sm" rows="2" required></textarea></div>
                            <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-bold">Ajukan Peminjaman</button>
                        </form>`;
                    }
                    // Tambahkan ELSE IF lain untuk konseling, pesan, dll sesuai pola di atas.
                    else {
                        html += `<p class="text-center text-gray-500 py-10">Form ${type} sedang dalam pengembangan UI.</p>`;
                    }

                    html += `</div>`;
                    m.innerHTML = html;
                    
                    c.classList.remove('hide');
                    // Trigger reflow untuk animasi GPU
                    void c.offsetWidth;
                    c.classList.remove('opacity-0');
                    m.classList.remove('translate-y-full');
                },
                close: () => {
                    const c = document.getElementById('modal-container');
                    const m = document.getElementById('modal-content');
                    c.classList.add('opacity-0');
                    m.classList.add('translate-y-full');
                    setTimeout(() => { c.classList.add('hide'); m.innerHTML = ''; }, 300);
                },
                submit: (e, msg) => {
                    e.preventDefault();
                    alert(msg);
                    App.Modal.close();
                }
            },

            // SCANNER KAMERA LAZY LOAD (Disederhanakan untuk performa PWA)
            QR: {
                open: (context = 'login') => {
                    alert(`Fitur scanner untuk ${context} akan membuka kamera native/library.`);
                    // Implementasi html5-qrcode diletakkan di sini via dynamic import script
                }
            }
        };

        // Bootstrap App
        window.addEventListener('DOMContentLoaded', () => App.UI.init());
    </script>
</body>
</html>
