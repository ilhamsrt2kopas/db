</head>

    <!-- KONFIGURASI DATABASE -->
    <script>

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    <!-- Global Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden p-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl flex flex-col items-center gap-3">
            <div class="w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm font-semibold text-slate-700 text-center" id="loadingText">Memuat Data...</p>
        </div>
    </div>

    <!-- App Root Container -->
    <div id="app" class="flex-1 flex flex-col"></div>

    <!-- Modal Konfirmasi Transaksi -->
    <div id="confirmModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-40 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">

            <p class="text-sm text-slate-500 mb-4" id="modalTypeText">Anda akan melakukan transaksi:</p>

                <button onclick="executeTransaction()" class="flex-1 px-4 py-2.5 rounded-xl bg-orange-500 text-white font-medium hover:bg-orange-600 transition shadow-lg shadow-orange-500/20">Ya, Lanjutkan</button>

    <!-- Modal Pengembalian -->
    <div id="returnModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-40 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <h3 class="text-xl font-bold text-slate-900 mb-2 flex items-center gap-2">
                <i class="fa-solid fa-arrow-rotate-left text-green-600"></i> Pengembalian Barang
            </h3>
            <p class="text-sm text-slate-500 mb-4" id="returnItemInfo">Barang: -</p>
            <div class="mb-4">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Jumlah yang Dikembalikan</label>
                <input type="number" id="returnQtyInput" min="1" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-600">
            </div>
            <div class="flex gap-3">
                <button onclick="closeReturnModal()" class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-medium hover:bg-slate-100 transition">Batal</button>
                <button onclick="executeReturn()" class="flex-1 px-4 py-2.5 rounded-xl bg-green-600 text-white font-medium hover:bg-green-700 transition shadow-lg shadow-green-600/20">Proses</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 left-5 md:left-auto hidden z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl text-sm flex items-center justify-center md:justify-start gap-3">
        <span id="toastMsg" class="text-center md:text-left">Notifikasi</span>
    </div>

    <script>
        const CATEGORIES_LIST = [
            'ATK',
            'Elektronik/Listrik',
            'Kebersihan',
            'Kesehatan',
            'Konsumsi',
            'Olahraga',
            'Lainnya',
            'Kendaraan',
            'Kunci'
        ];

        let state = {
            user: JSON.parse(localStorage.getItem('sr_user')) || null,
            barang: [],
            transaksi: [],
            cart: {}, 
            addStockCart: {}, 
            newItemList: [ { nama: '', kategori: 'ATK', sumber: 'Perkantoran', stok: 0, hanyaPinjam: false } ], 
            activeTab: 'dashboard',
            barangSubmenuOpen: true,
            searchQuery: '',
            addStockSearchQuery: '',
            historySearchQuery: '',
            selectedCategory: 'Semua',
            sortColumn: 'nama',
            sortAsc: true,
            mobileMenuOpen: false
        };

        let realtimeChannel = null;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
            });
        }

        function showLoading(text = "Memuat Data...") {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').classList.remove('hidden');
            document.getElementById('loadingOverlay').classList.add('flex');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('flex');
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        async function fetchAppData(silent = false) {
            if (!silent) showLoading("Mengambil data dari Database...");
            
            state.cart = {};
            state.addStockCart = {};

            try {
                const { data: dataBarang, error: errBarang } = await supabaseClient
                    .from('barang')
                    .select('*')
                    .order('nama_barang', { ascending: true });
                if (errBarang) throw errBarang;

                const { data: dataTrx, error: errTrx } = await supabaseClient
                    .from('transaksi')
                    .select('*')
                    .order('id_transaksi', { ascending: false });
                if (errTrx) throw errTrx;

                state.barang = (dataBarang || []).map(b => ({
                    id: b.id_barang || b.id,
                    sumberPerolehan: b.sumber_perolehan || '',
                    kategori: b.kategori || 'ATK',
                    nama: b.nama_barang || b.nama || '',
                    stok: Number(b.stok || 0),
                    hanyaPinjam: Boolean(b.hanya_pinjam)
                }));

                const todayStr = new Date().toISOString().split('T')[0];
                state.transaksi = (dataTrx || []).map(t => {
                    const idTrxStr = String(t.id_transaksi || '');
                    let trxDateStr = todayStr;
                    if (idTrxStr.length >= 8) {
                        const cleanId = idTrxStr.replace(/^K-/, '');
                        if (cleanId.length >= 6) {
                            const yy = '20' + cleanId.slice(0, 2);
                            const mm = cleanId.slice(2, 4);
                            const dd = cleanId.slice(4, 6);
                            trxDateStr = `${yy}-${mm}-${dd}`;
                        }
                    }
                    return {
                        idTransaksi: t.id_transaksi || t.id,
                        nip: t.nip || '',
                        namaPengguna: t.nama_pengguna || t.nama || 'Pengguna',
                        idBarang: t.id_barang,
                        namaBarang: t.nama_barang || 'Barang',
                        jumlah: Number(t.jumlah || 0),
                        jenis: t.jenis_transaksi || t.jenis || '',
                        status: t.status || '',
                        isToday: (trxDateStr === todayStr)
                    };
                });

                render();
            } catch (err) {
                console.error("Database error:", err);
                if (!silent) showToast("Gagal memuat data dari Database.", true);
            } finally {
                if (!silent) hideLoading();
            }
        }

        function initRealtimeListener() {
            if (realtimeChannel) {
                supabaseClient.removeChannel(realtimeChannel);
            }

            realtimeChannel = supabaseClient.channel('public-db-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'barang' }, () => fetchAppData(true))
                .on('postgres_changes', { event: '*', schema: 'public', table: 'transaksi' }, () => fetchAppData(true))
                .on('postgres_changes', { event: '*', schema: 'public', table: 'masuk' }, () => fetchAppData(true))
                .subscribe();
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.user) {
                app.innerHTML = renderLoginView();
            } else {
                app.innerHTML = renderMainLayout();
                if (state.activeTab === 'dashboard') {
                    renderDashboardContent();
                } else if (state.activeTab === 'barang') {
                    renderBarangContent();
                } else if (state.activeTab === 'tambahstok') {
                    renderTambahStokContent();
                } else if (state.activeTab === 'pengembalian') {
                    renderPengembalianContent();
                } else if (state.activeTab === 'riwayat') {
                    renderRiwayatContent();
                } else if (state.activeTab === 'gantipassword') {
                    renderPasswordContent();
                }
            }
        }

        function renderLoginView() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-orange-50 to-amber-50">
                    <div class="bg-white rounded-3xl shadow-xl p-6 sm:p-8 max-w-md w-full border border-slate-100">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-orange-500 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl sm:text-3xl font-bold shadow-lg shadow-orange-500/30 mb-4">
                                <i class="fa-solid fa-graduation-cap"></i>
                            </div>
                            <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Sekolah Rakyat Terintegrasi 2</h1>
                            <p class="text-xs sm:text-sm text-slate-500 mt-1">Kota Pasuruan</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Nomor Induk Pegawai (NIP)</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><i class="fa-solid fa-id-card"></i></span>
                                    <input type="text" id="nip" required class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition" placeholder="Masukkan NIP anda">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Password</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="password" required class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition" placeholder="••••••••">
                                </div>
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-orange-500 text-white font-medium rounded-xl hover:bg-orange-600 transition shadow-lg shadow-orange-500/30 flex items-center justify-center gap-2">
                                <i class="fa-solid fa-right-to-bracket"></i> Masuk Sistem
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const nip = document.getElementById('nip').value.trim();
            const password = document.getElementById('password').value.trim();
            
            showLoading("Memverifikasi Login...");
            try {
                const { data, error } = await supabaseClient
                    .from('pengguna')
                    .select('*')
                    .eq('nip', nip)
                    .eq('password', password)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    const userData = {
                        nip: data.nip,
                        nama: data.nama,
                        jabatan: data.jabatan,
                        isAdmin: Boolean(data.is_admin)
                    };
                    state.user = userData;
                    localStorage.setItem('sr_user', JSON.stringify(userData));
                    showToast("Login berhasil!");
                    await fetchAppData();
                    initRealtimeListener();
                } else {
                    showToast("NIP atau Password salah!", true);
                }
            } catch (err) {
                console.error(err);
                showToast("Terjadi kesalahan koneksi login.", true);
            } finally {
                hideLoading();
            }
        }

        function handleLogout() {
            if (realtimeChannel) {
                supabaseClient.removeChannel(realtimeChannel);
                realtimeChannel = null;
            }
            localStorage.removeItem('sr_user');
            state.user = null;
            state.cart = {};
            state.addStockCart = {};
            render();
        }

        function toggleMobileMenu() {
            state.mobileMenuOpen = !state.mobileMenuOpen;
            render();
        }

        function toggleBarangSubmenu() {
            state.barangSubmenuOpen = !state.barangSubmenuOpen;
            render();
        }

        function renderMainLayout() {
            return `
                <div class="flex flex-col md:flex-row h-screen overflow-hidden">
                    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between md:hidden z-30 shrink-0">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 bg-orange-500 text-white rounded-lg flex items-center justify-center font-bold text-sm shadow-sm">
                                <i class="fa-solid fa-graduation-cap"></i>
                            </div>
                            <div>
                                <h2 class="font-bold text-slate-900 text-xs">Sekolah Rakyat Terintegrasi 2</h2>
                                <p class="text-[10px] text-orange-600 font-semibold">Kota Pasuruan</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="fetchAppData()" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg"><i class="fa-solid fa-rotate-right"></i></button>
                            <button onclick="toggleMobileMenu()" class="p-2 text-slate-800 hover:bg-slate-100 rounded-lg text-lg"><i class="fa-solid fa-bars"></i></button>
                        </div>
                    </header>

                    ${state.mobileMenuOpen ? `
                        <div class="fixed inset-0 bg-black/50 z-40 md:hidden flex justify-end" onclick="toggleMobileMenu()">
                            <div class="w-72 bg-slate-900 text-slate-300 h-full flex flex-col p-5 shadow-2xl" onclick="event.stopPropagation()">
                                <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
                                    <div class="flex items-center gap-3">
                                        <div class="w-9 h-9 bg-orange-500 text-white rounded-xl flex items-center justify-center font-bold">
                                            <i class="fa-solid fa-graduation-cap"></i>
                                        </div>
                                        <div>
                                            <h2 class="font-bold text-white text-xs">Sekolah Rakyat Terintegrasi 2</h2>
                                            <p class="text-[11px] text-orange-400">Kota Pasuruan</p>
                                        </div>
                                    </div>
                                    <button onclick="toggleMobileMenu()" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <nav class="flex-1 space-y-1.5 overflow-y-auto">
                                    <button onclick="switchTab('dashboard'); toggleMobileMenu();" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition ${state.activeTab === 'dashboard' ? 'bg-orange-500 text-white shadow-lg' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}">
                                        <i class="fa-solid fa-chart-pie w-5"></i> Dasbor
                                    </button>
                                    
                                    <div>
                                        <button onclick="toggleBarangSubmenu()" class="w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium text-sm text-slate-400 hover:bg-slate-800 hover:text-white transition">
                                            <span class="flex items-center gap-3"><i class="fa-solid fa-boxes-stacked w-5"></i> Barang</span>
                                            <i class="fa-solid ${state.barangSubmenuOpen ? 'fa-chevron-down' : 'fa-chevron-right'} text-xs"></i>
                                        </button>
                                        ${state.barangSubmenuOpen ? `
                                            <div class="pl-9 pr-2 py-1 space-y-1">
                                                <button onclick="switchTab('barang'); toggleMobileMenu();" class="w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition ${state.activeTab === 'barang' ? 'bg-orange-500/20 text-orange-400 font-bold' : 'text-slate-400 hover:text-white'}">
                                                    Daftar Barang
                                                </button>
                                                ${state.user.isAdmin ? `
                                                    <button onclick="switchTab('tambahstok'); toggleMobileMenu();" class="w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition ${state.activeTab === 'tambahstok' ? 'bg-orange-500/20 text-orange-400 font-bold' : 'text-slate-400 hover:text-white'}">
                                                        Tambah Stok Barang
                                                    </button>
                                                ` : ''}
                                                <button onclick="switchTab('pengembalian'); toggleMobileMenu();" class="w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition ${state.activeTab === 'pengembalian' ? 'bg-orange-500/20 text-orange-400 font-bold' : 'text-slate-400 hover:text-white'}">
                                                    Pengembalian Barang Pinjaman
                                                </button>
                                                <button onclick="switchTab('riwayat'); toggleMobileMenu();" class="w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition ${state.activeTab === 'riwayat' ? 'bg-orange-500/20 text-orange-400 font-bold' : 'text-slate-400 hover:text-white'}">
                                                    Riwayat Peminjaman
                                                </button>
                                            </div>
                                        ` : ''}
                                    </div>

                                    <button onclick="switchTab('gantipassword'); toggleMobileMenu();" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition ${state.activeTab === 'gantipassword' ? 'bg-orange-500 text-white shadow-lg' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}">
                                        <i class="fa-solid fa-key w-5"></i> Ganti Password
                                    </button>
                                </nav>
                                <div class="pt-4 border-t border-slate-800">
                                    <div class="mb-3 px-2">
                                        <p class="text-xs font-semibold text-white truncate">${state.user.nama}</p>
                                        <p class="text-[11px] text-slate-400">${state.user.jabatan}${state.user.isAdmin ? '<span class="text-orange-400 font-bold">(Admin)</span>' : ''}</p>
                                    </div>
                                    <button onclick="handleLogout()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl font-medium text-sm text-red-400 hover:bg-red-500/10 transition">
                                        <i class="fa-solid fa-right-from-bracket w-5"></i> Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <aside class="w-64 bg-slate-900 text-slate-300 hidden md:flex flex-col border-r border-slate-800 shrink-0">
                        <div class="p-6 border-b border-slate-800 flex items-center gap-3">
                            <div class="w-10 h-10 bg-orange-500 text-white rounded-xl flex items-center justify-center font-bold shadow-md shadow-orange-500/20">
                                <i class="fa-solid fa-graduation-cap"></i>
                            </div>
                            <div>
                                <h2 class="font-bold text-white text-xs leading-tight">Sekolah Rakyat Terintegrasi 2</h2>
                                <p class="text-xs text-orange-400 mt-0.5">Kota Pasuruan</p>
                            </div>
                        </div>
                        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                            <button onclick="switchTab('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition ${state.activeTab === 'dashboard' ? 'bg-orange-500 text-white shadow-lg shadow-orange-500/30' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}">
                                <i class="fa-solid fa-chart-pie w-5"></i> Dasbor
                            </button>

                            <div>
                                <button onclick="toggleBarangSubmenu()" class="w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium text-sm text-slate-400 hover:bg-slate-800 hover:text-white transition">
                                    <span class="flex items-center gap-3"><i class="fa-solid fa-boxes-stacked w-5"></i> Barang</span>
                                    <i class="fa-solid ${state.barangSubmenuOpen ? 'fa-chevron-down' : 'fa-chevron-right'} text-xs"></i>
                                </button>
                                ${state.barangSubmenuOpen ? `
                                    <div class="pl-9 pr-2 py-1 space-y-1">
                                        <button onclick="switchTab('barang')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition ${state.activeTab === 'barang' ? 'bg-orange-500/20 text-orange-400 font-bold' : 'text-slate-400 hover:text-white'}">
                                            Daftar Barang
                                        </button>
                                        ${state.user.isAdmin ? `
                                            <button onclick="switchTab('tambahstok')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition ${state.activeTab === 'tambahstok' ? 'bg-orange-500/20 text-orange-400 font-bold' : 'text-slate-400 hover:text-white'}">
                                                Tambah Stok Barang
                                            </button>
                                        ` : ''}
                                        <button onclick="switchTab('pengembalian')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition ${state.activeTab === 'pengembalian' ? 'bg-orange-500/20 text-orange-400 font-bold' : 'text-slate-400 hover:text-white'}">
                                            Pengembalian Barang Pinjaman
                                        </button>
                                        <button onclick="switchTab('riwayat')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition ${state.activeTab === 'riwayat' ? 'bg-orange-500/20 text-orange-400 font-bold' : 'text-slate-400 hover:text-white'}">
                                            Riwayat Peminjaman
                                        </button>
                                    </div>
                                ` : ''}
                            </div>

                            <button onclick="switchTab('gantipassword')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition ${state.activeTab === 'gantipassword' ? 'bg-orange-500 text-white shadow-lg shadow-orange-500/30' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}">
                                <i class="fa-solid fa-key w-5"></i> Ganti Password
                            </button>
                        </nav>
                        <div class="p-4 border-t border-slate-800">

        async function handleChangePassword(e) {
            e.preventDefault();
            const oldPassword = document.getElementById('oldPassword').value.trim();
            const newPassword = document.getElementById('newPassword').value.trim();

            showLoading("Memperbarui password...");
            try {
                const { data, error } = await supabaseClient
                    .from('pengguna')
                    .update({ password: newPassword })
                    .eq('nip', state.user.nip)
                    .eq('password', oldPassword)
                    .select();

                if (error) throw error;

                if (data && data.length > 0) {
                    showToast("Password berhasil diperbarui!");
                    document.getElementById('oldPassword').value = '';
                    document.getElementById('newPassword').value = '';
                } else {
                    showToast("Password lama tidak sesuai!", true);
                }
            } catch(err) {
                console.error(err);
                showToast("Gagal memperbarui password.", true);
            } finally {
                hideLoading();
            }
        }

                        <!-- 1. TAMBAH ITEM BARU (DI ATAS) -->
                        <div class="bg-orange-50/60 border border-orange-200 rounded-2xl p-4 sm:p-6 space-y-4 mb-8">
                            <h4 class="text-xs font-bold text-orange-800 uppercase tracking-wider flex items-center gap-2">
                                <i class="fa-solid fa-circle-plus text-orange-600"></i> 1. Tambah Item Barang Baru
                            </h4>
                            <p class="text-xs text-slate-500">Isi formulir ini untuk mendaftarkan barang baru. Di komputer, tekan <kbd class="px-1.5 py-0.5 bg-white border border-slate-300 rounded font-mono text-[10px]">TAB</kbd> di akhir baris, atau gunakan tombol <strong>"+ Tambah Baris Baru"</strong> di bawah khusus pengguna smartphone.</p>

                            <div id="newItemContainer" class="space-y-4">
                                ${state.newItemList.map((item, idx) => `
                                    <div class="bg-white p-4 rounded-xl border border-orange-100 relative shadow-sm">
                                        ${state.newItemList.length > 1 ? `
                                            <button onclick="removeNewItemRow(${idx})" class="absolute top-2 right-2 text-red-500 hover:text-red-700 p-1 text-xs font-bold" title="Hapus Baris Ini">
                                                <i class="fa-solid fa-xmark text-sm"></i>
                                            </button>
                                        ` : ''}
                                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                            <div class="sm:col-span-2 lg:col-span-1">
                                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Nama Barang Baru #${idx + 1}</label>
                                                <input type="text" id="newItemNama_${idx}" oninput="updateNewItemData(${idx}, 'nama', this.value)" value="${item.nama}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Contoh: Proyektor Portable">
                                            </div>
                                            <div>
                                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Kategori</label>
                                                <select onchange="updateNewItemData(${idx}, 'kategori', this.value)" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-orange-500">
                                                    ${CATEGORIES_LIST.map(cat => `<option value="${cat}" ${item.kategori === cat ? 'selected' : ''}>${cat}</option>`).join('')}
                                                </select>
                                            </div>
                                            <div>
                                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Sumber Perolehan</label>
                                                <select onchange="updateNewItemData(${idx}, 'sumber', this.value)" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-orange-500">
                                                    <option value="Perkantoran" ${item.sumber === 'Perkantoran' ? 'selected' : ''}>Perkantoran (A)</option>
                                                    <option value="Persediaan" ${item.sumber === 'Persediaan' ? 'selected' : ''}>Persediaan (B)</option>
                                                    <option value="Media Pembelajaran" ${item.sumber === 'Media Pembelajaran' ? 'selected' : ''}>Media Pembelajaran (C)</option>
                                                    <option value="Aset Tetap" ${item.sumber === 'Aset Tetap' ? 'selected' : ''}>Aset Tetap (D)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Stok Awal</label>
                                                <input type="number" min="0" oninput="updateNewItemData(${idx}, 'stok', this.value)" value="${item.stok}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-orange-500">
                                            </div>
                                            <div class="flex items-center pt-3">
                                                <label class="flex items-center gap-2 cursor-pointer">
                                                    <input type="checkbox" onchange="updateNewItemData(${idx}, 'hanyaPinjam', this.checked)" ${item.hanyaPinjam ? 'checked' : ''} onkeydown="handleCheckKeydown(event, ${idx})" class="w-4 h-4 text-orange-500 rounded focus:ring-orange-500 border-slate-300">
                                                    <span class="text-xs font-semibold text-slate-700">Barang "Hanya Pinjam"</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="pt-2">
                                <button onclick="addNewItemRow()" class="w-full py-2.5 bg-white border-2 border-dashed border-orange-300 hover:border-orange-500 text-orange-600 font-bold text-xs rounded-xl transition flex items-center justify-center gap-2 shadow-sm">
                                    <i class="fa-solid fa-plus"></i> Tambah Baris Baru
                                </button>
                            </div>
                        </div>

                        <!-- 2. TAMBAH STOK BARANG YANG SUDAH ADA (DI BAWAH) -->
                        <div class="space-y-4">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">2. Tambah Stok Barang Yang Sudah Ada</h4>
                                
                                <div class="relative w-full sm:w-72">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                                    </span>
                                    <input type="text" oninput="handleAddStockSearch(this.value)" value="${state.addStockSearchQuery}" class="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition" placeholder="Cari nama atau ID barang...">
                                </div>
                            </div>

                            ${CATEGORIES_LIST.map(cat => {
                                let itemsInCat = filteredBarangExisting.filter(b => b.kategori === cat);
                                if (itemsInCat.length === 0) return '';
                                return `
                                    <div class="border border-slate-200 rounded-2xl overflow-hidden">
                                        <div class="bg-slate-100 px-4 py-2.5 border-b border-slate-200 font-bold text-xs text-slate-700 flex justify-between items-center">
                                            <span><i class="fa-solid fa-folder text-orange-500 mr-2"></i>Kategori: ${cat}</span>
                                            <span class="text-[11px] font-normal text-slate-500">${itemsInCat.length} Item</span>
                                        </div>
                                        <div class="divide-y divide-slate-100">
                                            ${itemsInCat.map(b => {
                                                let addQty = state.addStockCart[b.id] || 0;
                                                return `
                                                    <div class="p-3 sm:p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50/50 transition">
                                                        <div>
                                                            <p class="font-medium text-slate-800 text-xs sm:text-sm">${b.nama}</p>
                                                            <p class="text-[11px] text-slate-400 mt-0.5">Stok Saat Ini: <span class="font-bold text-slate-700">${b.stok}</span> | ID: <span class="font-mono text-slate-600">${b.id}</span> | Sumber: ${b.sumberPerolehan}</p>
                                                        </div>
                                                        <div class="flex items-center gap-2 self-end sm:self-center">
                                                            <span class="text-xs text-slate-500 font-medium">Tambah:</span>
                                                            <button onclick="updateAddStockCart('${b.id}', -1)" class="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 transition shrink-0"><i class="fa-solid fa-minus text-[10px]"></i></button>
                                                            <input type="number" min="0" value="${addQty}" oninput="manualInputAddStockCart('${b.id}', this.value)" class="w-16 text-center font-semibold text-slate-800 bg-slate-50 border border-slate-200 rounded-lg py-1 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
                                                            <button onclick="updateAddStockCart('${b.id}', 1)" class="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 transition shrink-0"><i class="fa-solid fa-plus text-[10px]"></i></button>
                                                        </div>
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    </div>
                                `;
                            }).join('')}

                            ${filteredBarangExisting.length === 0 ? `
                                <div class="text-center py-8 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                                    <p class="text-xs text-slate-400">Tidak ada barang yang cocok dengan kata kunci pencarian "${state.addStockSearchQuery}".</p>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function handleAddStockSearch(val) {
            state.addStockSearchQuery = val;
            renderTambahStokContent();
        }

        function addNewItemRow() {
            state.newItemList.push({ nama: '', kategori: 'ATK', sumber: 'Perkantoran', stok: 0, hanyaPinjam: false });
            renderTambahStokContent();
            setTimeout(() => {
                let newIdx = state.newItemList.length - 1;
                let nextInput = document.getElementById(`newItemNama_${newIdx}`);
                if (nextInput) nextInput.focus();
            }, 50);
        }

        function handleCheckKeydown(e, idx) {
            if (e.key === 'Tab' && !e.shiftKey && idx === state.newItemList.length - 1) {
                e.preventDefault();
                addNewItemRow();
            }
        }

        function removeNewItemRow(idx) {
            state.newItemList.splice(idx, 1);
            renderTambahStokContent();
        }

        function updateNewItemData(idx, field, val) {
            if (field === 'stok') val = parseInt(val) || 0;
            state.newItemList[idx][field] = val;
        }

        function updateAddStockCart(id, delta) {
            if (!state.addStockCart[id]) state.addStockCart[id] = 0;
            let newVal = state.addStockCart[id] + delta;
            if (newVal < 0) newVal = 0;
            state.addStockCart[id] = newVal;
            renderTambahStokContent();
        }

        function manualInputAddStockCart(id, val) {
            let num = parseInt(val);
            if (isNaN(num) || num < 0) num = 0;
            state.addStockCart[id] = num;
        }

        async function submitAddStock() {
            let existingItems = [];
            for (let id in state.addStockCart) {
                if (state.addStockCart[id] > 0) {
                    existingItems.push({ id: id, addQty: state.addStockCart[id] });
                }
            }

            let validNewItems = state.newItemList.filter(item => item.nama && item.nama.trim() !== '');

            if (existingItems.length === 0 && validNewItems.length === 0) {
                showToast("Isi penambahan stok atau lengkapi nama barang baru!", true);
                return;
            }

            showLoading("Menyimpan penambahan stok & log...");
            try {
                const now = new Date();
                const year = String(now.getFullYear()).slice(-2);
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const datePrefix = year + month + day;

                const { count } = await supabaseClient
                    .from('masuk')
                    .select('*', { count: 'exact', head: true })
                    .like('id_input', `M-${datePrefix}%`);

                let seq = (count || 0) + 1;
                let logMasukPayload = [];

                for (let item of existingItems) {
                    let targetBarang = state.barang.find(b => b.id === item.id);
                    if (targetBarang) {
                        let newStok = targetBarang.stok + item.addQty;
                        await supabaseClient
                            .from('barang')
                            .update({ stok: newStok })
                            .eq('id_barang', item.id);

                        const idInputVal = `M-${datePrefix}${String(seq).padStart(4, '0')}`;
                        seq++;

                        logMasukPayload.push({
                            id_input: idInputVal,
                            id_barang: item.id,
                            nama_barang: targetBarang.nama,
                            jumlah: item.addQty
                        });
                    }
                }

                if (validNewItems.length > 0) {
                    let insertPayload = [];
                    for (let newItem of validNewItems) {
                        let prefix = "A";
                        if (newItem.sumber === "Persediaan") prefix = "B";
                        else if (newItem.sumber === "Media Pembelajaran") prefix = "C";
                        else if (newItem.sumber === "Aset Tetap") prefix = "D";

                        let countPrefix = state.barang.filter(b => b.id.startsWith(prefix + "-")).length;
                        let newSeq = countPrefix + 1;
                        let formattedSeq = newSeq < 10 ? ("0" + newSeq) : String(newSeq);
                        let newIdBarang = prefix + "-" + formattedSeq;

                        insertPayload.push({
                            id_barang: newIdBarang,
                            sumber_perolehan: newItem.sumber,
                            kategori: newItem.kategori,
                            nama_barang: newItem.nama.trim(),
                            stok: newItem.stok,
                            hanya_pinjam: newItem.hanyaPinjam
                        });

                        state.barang.push({ id: newIdBarang, nama: newItem.nama });

                        if (newItem.stok > 0) {
                            const idInputVal = `M-${datePrefix}${String(seq).padStart(4, '0')}`;
                            seq++;

                            logMasukPayload.push({
                                id_input: idInputVal,
                                id_barang: newIdBarang,
                                nama_barang: newItem.nama.trim(),
                                jumlah: newItem.stok
                            });
                        }
                    }

                    await supabaseClient.from('barang').insert(insertPayload);
                }

                if (logMasukPayload.length > 0) {
                    const { error: errMasuk } = await supabaseClient.from('masuk').insert(logMasukPayload);
                    if (errMasuk) {
                        console.error("Gagal mencatat log masuk:", errMasuk);
                    }
                }

                showToast("Penambahan stok & log berhasil disimpan!");
                state.addStockCart = {};
                state.newItemList = [ { nama: '', kategori: 'ATK', sumber: 'Perkantoran', stok: 0, hanyaPinjam: false } ];
                state.addStockSearchQuery = '';
                await fetchAppData();
            } catch(err) {
                console.error(err);
                showToast("Gagal menyimpan penambahan stok.", true);
            } finally {
                hideLoading();
            }
        }

        function getFilteredBarang() {
            let filteredBarang = state.barang.filter(b => {
                let matchQuery = b.nama.toLowerCase().includes(state.searchQuery.toLowerCase()) || 
                                 b.id.toLowerCase().includes(state.searchQuery.toLowerCase()) || 
                                 b.kategori.toLowerCase().includes(state.searchQuery.toLowerCase());
                let matchCat = state.selectedCategory === 'Semua' || b.kategori === state.selectedCategory;
                return matchQuery && matchCat;
            });

            filteredBarang.sort((a, b) => {
                let valA = a[state.sortColumn];
                let valB = b[state.sortColumn];
                if (typeof valA === 'string') {
                    return state.sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
                return state.sortAsc ? valA - valB : valB - valA;
            });
            return filteredBarang;
        }

        function renderTableRows(filteredBarang) {
            if (filteredBarang.length === 0) {
                return '<tr><td colspan="3" class="p-8 text-center text-slate-400">Tidak ada barang yang ditemukan.</td></tr>';
            }
            return filteredBarang.map(b => {
                let qty = state.cart[b.id] || 0;
                return `
                    <tr class="hover:bg-slate-50/50 transition">
                        <td class="p-2.5 sm:p-4">
                            <p class="font-medium text-slate-800 text-xs sm:text-sm">${b.nama}</p>
                            <div class="flex items-center gap-1.5 mt-0.5 flex-wrap">
                                <span class="px-2 py-0.5 text-[10px] font-semibold rounded bg-slate-100 text-slate-600">${b.kategori}</span>
                                <span class="px-2 py-0.5 text-[10px] font-semibold rounded ${b.hanyaPinjam ? 'bg-orange-50 text-orange-600' : 'bg-green-50 text-green-600'}">${b.hanyaPinjam ? 'Hanya Pinjam' : 'Ambil/Pinjam'}</span>
                            </div>
                        </td>
                        <td class="p-2.5 sm:p-4 font-semibold text-slate-700">${b.stok}</td>
                        <td class="p-2.5 sm:p-4">
                            <div class="flex items-center justify-center gap-1 sm:gap-2">
                                <button onclick="updateCart('${b.id}', -1, ${b.stok})" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 transition shrink-0"><i class="fa-solid fa-minus text-[10px]"></i></button>
                                <input type="number" min="0" max="${b.stok}" value="${qty}" oninput="manualInputCart('${b.id}', this.value, ${b.stok})" class="w-12 sm:w-14 text-center font-semibold text-slate-800 bg-slate-50 border border-slate-200 rounded-lg py-1 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
                                <button onclick="updateCart('${b.id}', 1, ${b.stok})" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 transition shrink-0"><i class="fa-solid fa-plus text-[10px]"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function handleSearchInput(val) {
            state.searchQuery = val;
            const tbody = document.getElementById('barangTableBody');
            if (!tbody) return;
            tbody.innerHTML = renderTableRows(getFilteredBarang());
        }

        function filterCategory(cat) {
            state.selectedCategory = cat;
            renderBarangContent();
        }

        function sortBarang(col) {
            if (state.sortColumn === col) {
                state.sortAsc = !state.sortAsc;
            } else {
                state.sortColumn = col;
                state.sortAsc = true;
            }
            renderBarangContent();
        }

        function updateCart(id, delta, maxStok) {
            if (!state.cart[id]) state.cart[id] = 0;
            let newVal = state.cart[id] + delta;
            if (newVal < 0) newVal = 0;
            if (newVal > maxStok) newVal = maxStok;
            state.cart[id] = newVal;
            
            const btnAmbil = document.getElementById('btnAmbil');
            if (btnAmbil) {
                btnAmbil.disabled = isHanyaPinjamInCart();
            }

            const tbody = document.getElementById('barangTableBody');
            if (tbody) {
                tbody.innerHTML = renderTableRows(getFilteredBarang());
            }
        }

        function manualInputCart(id, val, maxStok) {
            let num = parseInt(val);
            if (isNaN(num) || num < 0) num = 0;
            if (num > maxStok) num = maxStok;
            state.cart[id] = num;

            const btnAmbil = document.getElementById('btnAmbil');
            if (btnAmbil) {
                btnAmbil.disabled = isHanyaPinjamInCart();
            }
        }

        let pendingJenis = '';
        function confirmAction(jenis) {
            let selectedItems = [];
            for (let id in state.cart) {
                let qty = state.cart[id];
                if (qty > 0) {
                    let item = state.barang.find(b => b.id === id);
                    if (item) selectedItems.push({ ...item, qty });
                }
            }

            if (selectedItems.length === 0) {
                showToast("Pilih minimal 1 barang terlebih dahulu!", true);
                return;
            }

            pendingJenis = jenis;
            document.getElementById('modalTypeText').innerText = `Anda akan melakukan ${jenis} untuk barang berikut:`;
            document.getElementById('modalItemList').innerHTML = selectedItems.map(i => `
                <div class="flex justify-between items-center py-2 border-b border-slate-100 text-sm">
                    <span class="font-medium text-slate-800">${i.nama}</span>
                    <span class="bg-orange-50 text-orange-600 px-2.5 py-0.5 rounded-lg text-xs font-semibold">x${i.qty}</span>
                </div>
            `).join('');

            document.getElementById('confirmModal').classList.remove('hidden');
            document.getElementById('confirmModal').classList.add('flex');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('flex');
            document.getElementById('confirmModal').classList.add('hidden');
        }

        async function executeTransaction() {
            closeConfirmModal();
            let itemsPayload = [];
            for (let id in state.cart) {
                if (state.cart[id] > 0) {
                    itemsPayload.push({ id: id, jumlah: state.cart[id] });
                }
            }

            showLoading("Memproses Transaksi...");
            try {
                const now = new Date();
                const year = String(now.getFullYear()).slice(-2);
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const datePrefix = year + month + day;

                const { count } = await supabaseClient
                    .from('transaksi')
                    .select('*', { count: 'exact', head: true })
                    .like('id_transaksi', `K-${datePrefix}%`);

                const seq = (count || 0) + 1;
                const seqPadded = String(seq).padStart(4, '0');
                const customTrxId = `K-${datePrefix}${seqPadded}`;
                
                const timestampStr = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                const statusTrx = (pendingJenis === "Ambil") ? `Selesai pada ${timestampStr}` : `Dipinjam pada ${timestampStr}`;

                for (let itm of itemsPayload) {
                    let targetBarang = state.barang.find(b => b.id === itm.id);
                    if (targetBarang) {
                        let newStok = targetBarang.stok - itm.jumlah;
                        await supabaseClient
                            .from('barang')
                            .update({ stok: newStok })
                            .eq('id_barang', itm.id);

                        await supabaseClient.from('transaksi').insert([{
                            id_transaksi: customTrxId,
                            nip: state.user.nip,
                            nama_pengguna: state.user.nama,
                            id_barang: itm.id,
                            nama_barang: targetBarang.nama,
                            jumlah: itm.jumlah,
                            jenis_transaksi: pendingJenis,
                            status: statusTrx
                        }]);
                    }
                }

                showToast(`Transaksi berhasil diproses dengan ID: #${customTrxId}`);
                state.cart = {};
                await fetchAppData();
            } catch (err) {
                console.error(err);
                showToast("Gagal memproses transaksi.", true);
            } finally {
                hideLoading();
            }
        }

        let activeReturnTrxId = null;
        let maxReturnQty = 0;

        function openReturnModal(idTrx, namaBarang, maxQty) {
            activeReturnTrxId = idTrx;
            maxReturnQty = maxQty;
            document.getElementById('returnItemInfo').innerText = `Barang: ${namaBarang} (Maks. ${maxQty} unit)`;
            document.getElementById('returnQtyInput').value = maxQty;
            document.getElementById('returnQtyInput').max = maxQty;
            document.getElementById('returnModal').classList.remove('hidden');
            document.getElementById('returnModal').classList.add('flex');
        }

        function closeReturnModal() {
            document.getElementById('returnModal').classList.remove('flex');
            document.getElementById('returnModal').classList.add('hidden');
        }

        async function executeReturn() {
            let qty = Number(document.getElementById('returnQtyInput').value);
            if (qty <= 0 || qty > maxReturnQty) {
                showToast("Jumlah pengembalian tidak valid!", true);
                return;
            }

            closeReturnModal();
            showLoading("Memproses Pengembalian...");
            try {
                let trxObj = state.transaksi.find(t => t.idTransaksi === activeReturnTrxId);
                if (!trxObj) throw new Error("Transaksi tidak ditemukan.");

                const now = new Date();
                const timestampStr = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                
                let newStatus = "";
                if (qty === trxObj.jumlah) {
                    newStatus = state.user.isAdmin ? 
                        `Dikembalikan oleh Admin (${state.user.nama}) pada tanggal ${timestampStr}` : 
                        `Dikembalikan oleh peminjam pada tanggal ${timestampStr}`;
                } else {
                    newStatus = `Kembali sebagian (${qty}/${trxObj.jumlah}) pada ${timestampStr}`;
                }

                await supabaseClient
                    .from('transaksi')
                    .update({ status: newStatus })
                    .eq('id_transaksi', activeReturnTrxId);

                let targetBarang = state.barang.find(b => b.id === trxObj.idBarang);
                if (targetBarang) {
                    let updatedStok = targetBarang.stok + qty;
                    await supabaseClient
                        .from('barang')
                        .update({ stok: updatedStok })
                        .eq('id_barang', trxObj.idBarang);
                }

                showToast("Pengembalian barang berhasil dicatat!");
                await fetchAppData();
            } catch(err) {
                console.error(err);
                showToast("Gagal memproses pengembalian.", true);
            } finally {
                hideLoading();
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMsg');
            msgEl.innerText = msg;
            toast.className = `fixed bottom-5 right-5 left-5 md:left-auto z-50 text-white px-5 py-3 rounded-xl shadow-xl text-sm flex items-center justify-center md:justify-start gap-3 transition-all duration-300 ${isError ? 'bg-red-600' : 'bg-slate-900'}`;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3500);
        }

        window.onload = () => {
            if (state.user) {
                fetchAppData();
                initRealtimeListener();
            } else {
                render();
            }
        };
    </script>
</body>
</html>
