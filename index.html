                <button onclick="executeReturn()" class="flex-1 px-4 py-2.5 rounded-xl bg-green-600 text-white font-medium hover:bg-green-700 transition shadow-lg shadow-green-600/20">Proses</button>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 left-5 md:left-auto hidden z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl text-sm flex items-center justify-center md:justify-start gap-3">
        <span id="toastMsg" class="text-center md:text-left">Notifikasi</span>
    </div>

    <script>
        const CATEGORIES_LIST = [
            'ATK',
            'Elektronik/Listrik',
            'Kebersihan',
            'Kesehatan',
            'Konsumsi',
            'Olahraga',
            'Lainnya',
            'Kendaraan',
            'Kunci'
        ];

        let state = {
            user: JSON.parse(localStorage.getItem('sr_user')) || null,
            barang: [],
            transaksi: [],
            masuk: [],
            cart: {}, 
            addStockCart: {}, 
            newItemList: [ { nama: '', kategori: 'ATK', sumber: 'Perkantoran', stok: 0, hanyaPinjam: false } ], 
            activeTab: 'dashboard',
            barangSubmenuOpen: true,
            searchQuery: '',
            addStockSearchQuery: '',
            historySearchQuery: '',
            selectedCategory: 'Semua',
            sortColumn: 'nama',
            sortAsc: true,
            mobileMenuOpen: false,
            // Report Filter State
            reportNoSurat: '',
            reportJenisLaporan: 'keluar', 
            reportStartDate: new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0],
            reportEndDate: new Date().toISOString().split('T')[0],
            reportBarangQuery: '', 
            reportJenisTrx: 'semua' 
        };

        let realtimeChannel = null;

        // Touch Swipe Gestures
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);

        function handleSwipe() {
            if (!state.user) return;
            const swipeThreshold = 60;
            const mainTabs = ['dashboard', 'barang', 'gantipassword'];
            let currentIndex = mainTabs.indexOf(state.activeTab);
            
            if (currentIndex !== -1) {
                if (touchEndX < touchStartX - swipeThreshold) {
                    if (currentIndex < mainTabs.length - 1) {
                        switchTab(mainTabs[currentIndex + 1]);
                    }
                } else if (touchEndX > touchStartX + swipeThreshold) {
                    if (currentIndex > 0) {
                        switchTab(mainTabs[currentIndex - 1]);
                    }
                }
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
            });
        }

        function showLoading(text = "Memuat Data...") {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').classList.remove('hidden');
            document.getElementById('loadingOverlay').classList.add('flex');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('flex');
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        async function fetchAppData(silent = false) {
            if (!silent) showLoading("Mengambil data dari Database...");
            
            state.cart = {};
            state.addStockCart = {};

            try {
                const { data: dataBarang, error: errBarang } = await supabaseClient
                    .from('barang')
                    .select('*')
                    .order('nama_barang', { ascending: true });
                if (errBarang) throw errBarang;

                const { data: dataTrx, error: errTrx } = await supabaseClient
                    .from('transaksi')
                    .select('*')
                    .order('id_transaksi', { ascending: false });
                if (errTrx) throw errTrx;

                const { data: dataMasuk, error: errMasuk } = await supabaseClient
                    .from('masuk')
                    .select('*')
                    .order('id_input', { ascending: false });
                if (errMasuk) throw errMasuk;

                const { data: dataPengguna } = await supabaseClient
                    .from('pengguna')
                    .select('nip, nama, jabatan');
                const penggunaByNip = Object.fromEntries((dataPengguna || []).map(p => [
                    String(p.nip || ''), { nama: p.nama || '', jabatan: p.jabatan || 'Pegawai' }
                ]));

                state.barang = (dataBarang || []).map(b => ({
                    id: b.id_barang || b.id,
                    sumberPerolehan: b.sumber_perolehan || '',
                    kategori: b.kategori || 'ATK',
                    nama: b.nama_barang || b.nama || '',
                    stok: Number(b.stok || 0),
                    hanyaPinjam: Boolean(b.hanya_pinjam)
                }));

                const todayStr = new Date().toISOString().split('T')[0];
                state.transaksi = (dataTrx || []).map(t => {
                    const idTrxStr = String(t.id_transaksi || '');
                    let trxDateStr = todayStr;
                    if (idTrxStr.length >= 8) {
                        const cleanId = idTrxStr.replace(/^K-/, '');
                        if (cleanId.length >= 6) {
                            const yy = '20' + cleanId.slice(0, 2);
                            const mm = cleanId.slice(2, 4);
                            const dd = cleanId.slice(4, 6);
                            trxDateStr = `${yy}-${mm}-${dd}`;
                        }
                    }
                    return {
                        idTransaksi: t.id_transaksi || t.id,
                        nip: t.nip || '',
                        namaPengguna: t.nama_pengguna || t.nama || penggunaByNip[String(t.nip || '')]?.nama || 'Pengguna',
                        jabatan: penggunaByNip[String(t.nip || '')]?.jabatan || 'Pegawai',
                        idBarang: t.id_barang,
                        namaBarang: t.nama_barang || 'Barang',
                        jumlah: Number(t.jumlah || 0),
                        jenis: t.jenis_transaksi || t.jenis || '',
                        status: t.status || '',
                        tanggal: trxDateStr,
                        isToday: (trxDateStr === todayStr)
                    };
                });

                state.masuk = (dataMasuk || []).map(m => {
                    const idInputStr = String(m.id_input || '');
                    let masukDateStr = todayStr;
                    if (idInputStr.length >= 8) {
                        const cleanId = idInputStr.replace(/^M-/, '');
                        if (cleanId.length >= 6) {
                            const yy = '20' + cleanId.slice(0, 2);
                            const mm = cleanId.slice(2, 4);
                            const dd = cleanId.slice(4, 6);
                            masukDateStr = `${yy}-${mm}-${dd}`;
                        }
                    }
                    return {
                        idInput: m.id_input || '',
                        idBarang: m.id_barang || '',
                        namaBarang: m.nama_barang || 'Barang',
                        jumlah: Number(m.jumlah || 0),
                        tanggal: masukDateStr
                    };
                });

                render();
            } catch (err) {
                console.error("Database error:", err);
                if (!silent) showToast("Gagal memuat data dari Database.", true);
            } finally {
                if (!silent) hideLoading();
            }
        }

        function initRealtimeListener() {
            if (realtimeChannel) {
                supabaseClient.removeChannel(realtimeChannel);
            }

            realtimeChannel = supabaseClient.channel('public-db-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'barang' }, () => fetchAppData(true))
                .on('postgres_changes', { event: '*', schema: 'public', table: 'transaksi' }, () => fetchAppData(true))
                .on('postgres_changes', { event: '*', schema: 'public', table: 'masuk' }, () => fetchAppData(true))
                .subscribe();
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.user) {
                app.innerHTML = renderLoginView();
            } else {
                app.innerHTML = renderMainLayout();
                if (state.activeTab === 'dashboard') {
                    renderDashboardContent();
                } else if (['barang', 'tambahstok', 'pengembalian', 'riwayat', 'cetaklaporan'].includes(state.activeTab)) {
                    renderBarangContent();
                } else if (state.activeTab === 'gantipassword') {
                    renderPasswordContent();
                }
            }
        }

        function renderLoginView() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-orange-50 to-amber-50 h-full overflow-y-auto">
                    <div class="bg-white rounded-3xl shadow-xl p-6 sm:p-8 max-w-md w-full border border-slate-100">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-orange-500 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl sm:text-3xl font-bold shadow-lg shadow-orange-500/30 mb-4">
                                <i class="fa-solid fa-graduation-cap"></i>
                            </div>
                            <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Sekolah Rakyat Terintegrasi 2</h1>
                            <p class="text-xs sm:text-sm text-slate-500 mt-1">Kota Pasuruan</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Nomor Induk Pegawai (NIP)</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><i class="fa-solid fa-id-card"></i></span>
                                    <input type="text" id="nip" required class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition" placeholder="Masukkan NIP anda">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Password</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="password" required class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition" placeholder="••••••••">
                                </div>
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-orange-500 text-white font-medium rounded-xl hover:bg-orange-600 transition shadow-lg shadow-orange-500/30 flex items-center justify-center gap-2">
                                <i class="fa-solid fa-right-to-bracket"></i> Masuk Sistem
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const nip = document.getElementById('nip').value.trim();
            const password = document.getElementById('password').value.trim();
            
            showLoading("Memverifikasi Login...");
            try {
                const { data, error } = await supabaseClient
                    .from('pengguna')
                    .select('*')
                    .eq('nip', nip)
                    .eq('password', password)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    const userData = {
                        nip: data.nip,
                        nama: data.nama,
                        jabatan: data.jabatan,
                        isAdmin: Boolean(data.is_admin)
                    };
                    state.user = userData;
                    localStorage.setItem('sr_user', JSON.stringify(userData));
                    showToast("Login berhasil!");
                    await fetchAppData();
                    initRealtimeListener();
                } else {
                    showToast("NIP atau Password salah!", true);
                }
            } catch (err) {
                console.error(err);
                showToast("Terjadi kesalahan koneksi login.", true);
            } finally {
                hideLoading();
            }
        }

        function handleLogout() {
            if (realtimeChannel) {
                supabaseClient.removeChannel(realtimeChannel);
                realtimeChannel = null;
            }
            localStorage.removeItem('sr_user');
            state.user = null;
            state.cart = {};
            state.addStockCart = {};
            render();
        }

        function renderMainLayout() {
            const barangTabs = [
                { id: 'barang', label: 'Daftar Barang', icon: 'fa-boxes-stacked' },
                ...(state.user.isAdmin ? [{ id: 'tambahstok', label: 'Tambah Stok', icon: 'fa-circle-plus' }] : []),
                { id: 'pengembalian', label: 'Pengembalian', icon: 'fa-arrow-rotate-left' },
                { id: 'riwayat', label: 'Riwayat', icon: 'fa-list-check' },
                { id: 'cetaklaporan', label: 'Cetak Laporan', icon: 'fa-file-lines' }
            ];

            const isBarangSection = barangTabs.some(tab => tab.id === state.activeTab);

            return `
                <div class="h-full flex flex-col bg-slate-50 overflow-hidden">
                    <header class="bg-white border-b border-slate-200 px-3 sm:px-6 py-3 flex items-center justify-between shrink-0 z-30">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-9 h-9 bg-orange-500 text-white rounded-xl flex items-center justify-center font-bold shadow-sm shrink-0"><i class="fa-solid fa-graduation-cap"></i></div>
                            <div class="min-w-0">
                                <h2 class="font-bold text-slate-900 text-xs sm:text-sm truncate">Sekolah Rakyat Terintegrasi 2</h2>
                                <p class="text-[10px] sm:text-xs text-orange-600 font-semibold">Kota Pasuruan</p>
                            </div>
                        </div>
                        <button onclick="fetchAppData()" class="p-2.5 text-slate-500 hover:bg-slate-100 rounded-xl transition" title="Refresh Data" aria-label="Refresh data"><i class="fa-solid fa-rotate-right"></i></button>
                    </header>

                    <div class="flex-1 flex overflow-hidden">
                        <!-- SIDEBAR DENGAN WARNA KOMPLEMENTER (SLATE-900) -->
                        <aside class="hidden md:flex flex-col w-64 bg-slate-900 border-r border-slate-800 shrink-0 p-4 space-y-2 z-20 text-slate-200">
                            <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-1">Menu Utama</p>
                            <button onclick="switchTab('dashboard')" class="flex items-center gap-3 px-4 py-3 rounded-xl text-xs sm:text-sm font-semibold transition ${state.activeTab === 'dashboard' ? 'bg-orange-500 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
                                <i class="fa-solid fa-chart-pie w-5"></i><span>Dasbor</span>
                            </button>
                            <button onclick="switchTab('barang')" class="flex items-center gap-3 px-4 py-3 rounded-xl text-xs sm:text-sm font-semibold transition ${isBarangSection ? 'bg-orange-500 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
                                <i class="fa-solid fa-boxes-stacked w-5"></i><span>Inventaris & Modul</span>
                            </button>
                            <button onclick="switchTab('gantipassword')" class="flex items-center gap-3 px-4 py-3 rounded-xl text-xs sm:text-sm font-semibold transition ${state.activeTab === 'gantipassword' ? 'bg-orange-500 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
                                <i class="fa-solid fa-user-circle w-5"></i><span>Profil & Akun</span>
                            </button>

                            ${isBarangSection ? `
                                <div class="pt-4 mt-4 border-t border-slate-800 space-y-1">
                                    <p class="text-[10px] font-bold uppercase tracking-wider text-orange-400 px-3 mb-1">Submenu Barang</p>
                                    ${barangTabs.map(tab => `

        function initCombinedCategoryChart() {
            const ctx = document.getElementById('combinedCategoryChart');
            if (!ctx) return;

            const stats = getAllCategoriesStats();
            const labels = stats.map(s => s.category);
            const dataCounts = stats.map(s => s.itemCount);

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Jumlah Item',
                        data: dataCounts,
                        backgroundColor: '#f97316',
                        borderRadius: 8,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false } 
                    },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            grid: { borderDash: [4, 4] },
                            ticks: { 
                                font: { size: 11 },
                                precision: 0 
                            }
                        },
                        x: { 
                            grid: { display: false }, 
                            ticks: { font: { size: 11 } } 
                        }
                    }
                }
            });
        }

                return isMyLoan && isJenisPinjam;

                    t.idTransaksi.toLowerCase().includes(query) ||
                    t.namaPengguna.toLowerCase().includes(query) ||
                    t.namaBarang.toLowerCase().includes(query) ||
                    t.status.toLowerCase().includes(query)
                );
            }
            return loans;

        function getReportFilteredData() {
            let qBarang = (state.reportBarangQuery || '').toLowerCase().trim();

                return state.transaksi.filter(t => {
                    let matchDate = (!state.reportStartDate || t.tanggal >= state.reportStartDate) &&
                                    (!state.reportEndDate || t.tanggal <= state.reportEndDate);
                    let matchBarang = !qBarang || 
                                      t.idBarang.toLowerCase().includes(qBarang) || 
                                      t.namaBarang.toLowerCase().includes(qBarang);
                    let matchJenisTrx = (state.reportJenisTrx === 'semua' || (t.jenis || '').toLowerCase().includes(state.reportJenisTrx.toLowerCase()));
                    return matchDate && matchBarang && matchJenisTrx;
                });
            } else {
                return state.masuk.filter(m => {
                    let matchDate = (!state.reportStartDate || m.tanggal >= state.reportStartDate) &&
                                    (!state.reportEndDate || m.tanggal <= state.reportEndDate);
                    let matchBarang = !qBarang || 
                                      m.idBarang.toLowerCase().includes(qBarang) || 
                                      m.namaBarang.toLowerCase().includes(qBarang);
                    return matchDate && matchBarang;
                });
            }

            if (!state.addStockCart[id]) state.addStockCart[id] = 0;
            let newVal = state.addStockCart[id] + delta;
            if (newVal < 0) newVal = 0;
            state.addStockCart[id] = newVal;
            
            const container = document.getElementById('addStockItemsListContainer');
            if (container) {
                let query = (state.addStockSearchQuery || '').toLowerCase().trim();
                let filtered = state.barang.filter(b => b.nama.toLowerCase().includes(query) || b.id.toLowerCase().includes(query) || b.kategori.toLowerCase().includes(query));
                container.innerHTML = getAddStockCategoriesHTML(filtered);
            }
        }

        function manualInputAddStockCart(id, val) {
            let num = parseInt(val);
            if (isNaN(num) || num < 0) num = 0;
            state.addStockCart[id] = num;
        }

        async function submitAddStock() {
            let existingItems = [];
            for (let id in state.addStockCart) {
                if (state.addStockCart[id] > 0) {
                    existingItems.push({ id: id, addQty: state.addStockCart[id] });
                }
            }

            let validNewItems = state.newItemList.filter(item => item.nama && item.nama.trim() !== '');

            if (existingItems.length === 0 && validNewItems.length === 0) {
                showToast("Isi penambahan stok atau lengkapi nama barang baru!", true);
                return;
            }

            showLoading("Menyimpan penambahan stok & log...");
            try {
                const now = new Date();
                const year = String(now.getFullYear()).slice(-2);
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const datePrefix = year + month + day;

                const { count } = await supabaseClient
                    .from('masuk')
                    .select('*', { count: 'exact', head: true })
                    .like('id_input', `M-${datePrefix}%`);

                let seq = (count || 0) + 1;
                let logMasukPayload = [];

                for (let item of existingItems) {
                    let targetBarang = state.barang.find(b => b.id === item.id);
                    if (targetBarang) {
                        let newStok = targetBarang.stok + item.addQty;
                        await supabaseClient
                            .from('barang')
                            .update({ stok: newStok })
                            .eq('id_barang', item.id);

                        const idInputVal = `M-${datePrefix}${String(seq).padStart(4, '0')}`;
                        seq++;

                        logMasukPayload.push({
                            id_input: idInputVal,
                            id_barang: item.id,
                            nama_barang: targetBarang.nama,
                            jumlah: item.addQty
                        });
                    }
                }

                if (validNewItems.length > 0) {
                    let insertPayload = [];
                    for (let newItem of validNewItems) {
                        let prefix = "A";
                        if (newItem.sumber === "Persediaan") prefix = "B";
                        else if (newItem.sumber === "Media Pembelajaran") prefix = "C";
                        else if (newItem.sumber === "Aset Tetap") prefix = "D";

                        let countPrefix = state.barang.filter(b => b.id.startsWith(prefix + "-")).length;
                        let newSeq = countPrefix + 1;
                        let formattedSeq = newSeq < 10 ? ("0" + newSeq) : String(newSeq);
                        let newIdBarang = prefix + "-" + formattedSeq;

                        insertPayload.push({
                            id_barang: newIdBarang,
                            sumber_perolehan: newItem.sumber,
                            kategori: newItem.kategori,
                            nama_barang: newItem.nama.trim(),
                            stok: newItem.stok,
                            hanya_pinjam: newItem.hanyaPinjam
                        });

                        state.barang.push({ id: newIdBarang, nama: newItem.nama });

                        if (newItem.stok > 0) {
                            const idInputVal = `M-${datePrefix}${String(seq).padStart(4, '0')}`;
                            seq++;

                            logMasukPayload.push({
                                id_input: idInputVal,
                                id_barang: newIdBarang,
                                nama_barang: newItem.nama.trim(),
                                jumlah: newItem.stok
                            });
                        }
                    }

                    await supabaseClient.from('barang').insert(insertPayload);
                }

                if (logMasukPayload.length > 0) {
                    const { error: errMasuk } = await supabaseClient.from('masuk').insert(logMasukPayload);
                    if (errMasuk) {
                        console.error("Gagal mencatat log masuk:", errMasuk);
                    }
                }

                showToast("Penambahan stok & log berhasil disimpan!");
                state.addStockCart = {};
                state.newItemList = [ { nama: '', kategori: 'ATK', sumber: 'Perkantoran', stok: 0, hanyaPinjam: false } ];
                state.addStockSearchQuery = '';
                await fetchAppData();
            } catch(err) {
                console.error(err);
                showToast("Gagal menyimpan penambahan stok.", true);
            } finally {
                hideLoading();
            }
        }

        function getFilteredBarang() {
            let filteredBarang = state.barang.filter(b => {
                let matchQuery = b.nama.toLowerCase().includes(state.searchQuery.toLowerCase()) || 
                                 b.id.toLowerCase().includes(state.searchQuery.toLowerCase()) || 
                                 b.kategori.toLowerCase().includes(state.searchQuery.toLowerCase());
                let matchCat = state.selectedCategory === 'Semua' || b.kategori === state.selectedCategory;
                return matchQuery && matchCat;
            });

            filteredBarang.sort((a, b) => {
                let valA = a[state.sortColumn];
                let valB = b[state.sortColumn];
                if (typeof valA === 'string') {
                    return state.sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
                return state.sortAsc ? valA - valB : valB - valA;
            });
            return filteredBarang;
        }

        function renderTableRows(filteredBarang) {
            if (filteredBarang.length === 0) {
                return '<tr><td colspan="3" class="p-8 text-center text-slate-400">Tidak ada barang yang ditemukan.</td></tr>';
            }
            return filteredBarang.map(b => {
                let qty = state.cart[b.id] || 0;
                return `
                    <tr class="hover:bg-slate-50/50 transition">
                        <td class="p-2.5 sm:p-4">
                            <p class="font-medium text-slate-800 text-xs sm:text-sm">${b.nama}</p>
                            <div class="flex items-center gap-1.5 mt-0.5 flex-wrap">
                                <span class="px-2 py-0.5 text-[10px] font-semibold rounded bg-slate-100 text-slate-600">${b.kategori}</span>
                                <span class="px-2 py-0.5 text-[10px] font-semibold rounded ${b.hanyaPinjam ? 'bg-orange-50 text-orange-600' : 'bg-green-50 text-green-600'}">${b.hanyaPinjam ? 'Hanya Pinjam' : 'Ambil/Pinjam'}</span>
                            </div>
                        </td>
                        <td class="p-2.5 sm:p-4 font-semibold text-slate-700">${b.stok}</td>
                        <td class="p-2.5 sm:p-4">
                            <div class="flex items-center justify-center gap-1 sm:gap-2">
                                <button onclick="updateCart('${b.id}', -1, ${b.stok})" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 transition shrink-0"><i class="fa-solid fa-minus text-[10px]"></i></button>
                                <input type="number" min="0" max="${b.stok}" value="${qty}" oninput="manualInputCart('${b.id}', this.value, ${b.stok})" class="w-12 sm:w-14 text-center font-semibold text-slate-800 bg-slate-50 border border-slate-200 rounded-lg py-1 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
                                <button onclick="updateCart('${b.id}', 1, ${b.stok})" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 transition shrink-0"><i class="fa-solid fa-plus text-[10px]"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function handleSearchInput(val) {
            state.searchQuery = val;
            const tbody = document.getElementById('barangTableBody');
            if (!tbody) return;
            tbody.innerHTML = renderTableRows(getFilteredBarang());
        }

        function filterCategory(cat) {
            state.selectedCategory = cat;
            renderBarangContent();
        }

        function sortBarang(col) {
            if (state.sortColumn === col) {
                state.sortAsc = !state.sortAsc;
            } else {
                state.sortColumn = col;
                state.sortAsc = true;
            }
            renderBarangContent();
        }

        function updateCart(id, delta, maxStok) {
            if (!state.cart[id]) state.cart[id] = 0;
            let newVal = state.cart[id] + delta;
            if (newVal < 0) newVal = 0;
            if (newVal > maxStok) newVal = maxStok;
            state.cart[id] = newVal;
            
            const btnAmbil = document.getElementById('btnAmbil');
            if (btnAmbil) {
                btnAmbil.disabled = isHanyaPinjamInCart();
            }

            const tbody = document.getElementById('barangTableBody');
            if (tbody) {
                tbody.innerHTML = renderTableRows(getFilteredBarang());
            }
        }

        function manualInputCart(id, val, maxStok) {
            let num = parseInt(val);
            if (isNaN(num) || num < 0) num = 0;
            if (num > maxStok) num = maxStok;
            state.cart[id] = num;

            const btnAmbil = document.getElementById('btnAmbil');
            if (btnAmbil) {
                btnAmbil.disabled = isHanyaPinjamInCart();
            }
        }

        let pendingJenis = '';
        function confirmAction(jenis) {
            let selectedItems = [];
            for (let id in state.cart) {
                let qty = state.cart[id];
                if (qty > 0) {
                    let item = state.barang.find(b => b.id === id);
                    if (item) selectedItems.push({ ...item, qty });
                }
            }

            if (selectedItems.length === 0) {
                showToast("Pilih minimal 1 barang terlebih dahulu!", true);
                return;
            }

            pendingJenis = jenis;
            document.getElementById('modalTypeText').innerText = `Anda akan melakukan ${jenis} untuk barang berikut:`;
            
            // Render items in modal with remove/delete buttons
            updateModalItemList(selectedItems);

            const tujuanContainer = document.getElementById('tujuanContainer');
            const applyAllWrapper = document.getElementById('applyAllTujuanWrapper');
            
            if (jenis === 'Pinjam') {
                tujuanContainer.classList.remove('hidden');
                document.getElementById('tujuanInput').value = '';
                if (selectedItems.length > 1) {
                    applyAllWrapper.classList.remove('hidden');
                    applyAllWrapper.classList.add('flex');
                    document.getElementById('applyAllTujuan').checked = true;
                } else {
                    applyAllWrapper.classList.remove('flex');
                    applyAllWrapper.classList.add('hidden');
                }
            } else {
                tujuanContainer.classList.add('hidden');
            }

            document.getElementById('confirmModal').classList.remove('hidden');
            document.getElementById('confirmModal').classList.add('flex');
        }

        function updateModalItemList(selectedItems) {
            const listEl = document.getElementById('modalItemList');
            if (selectedItems.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-slate-400 text-center py-2">Keranjang kosong.</p>';
                return;
            }
            listEl.innerHTML = selectedItems.map(i => `
                <div class="flex justify-between items-center py-1.5 border-b border-slate-100 text-sm gap-2">
                    <span class="font-medium text-slate-800 truncate">${i.nama} <span class="text-xs text-slate-500 font-normal">(x${i.qty})</span></span>
                    <button onclick="removeFromCartModal('${i.id}')" class="text-red-500 hover:text-red-700 p-1 text-xs font-bold shrink-0" title="Hapus item ini">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `).join('');
        }

        function removeFromCartModal(id) {
            delete state.cart[id];
            let selectedItems = [];
            for (let cartId in state.cart) {
                let qty = state.cart[cartId];
                if (qty > 0) {
                    let item = state.barang.find(b => b.id === cartId);
                    if (item) selectedItems.push({ ...item, qty });
                }
            }

            if (selectedItems.length === 0) {
                closeConfirmModal();
                renderBarangContent();
                showToast("Semua item dihapus dari pilihan.", true);
                return;
            }

            updateModalItemList(selectedItems);
            // Refresh main table as well
            const tbody = document.getElementById('barangTableBody');
            if (tbody) tbody.innerHTML = renderTableRows(getFilteredBarang());
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('flex');
            document.getElementById('confirmModal').classList.add('hidden');
        }

        async function executeTransaction() {
            let tujuanVal = '';
            if (pendingJenis === 'Pinjam') {
                tujuanVal = document.getElementById('tujuanInput').value.trim();
                if (!tujuanVal) {
                    showToast("Tujuan penggunaan wajib diisi untuk peminjaman!", true);
                    document.getElementById('tujuanInput').focus();
                    return;
                }
            }

            closeConfirmModal();
            let itemsPayload = [];
            for (let id in state.cart) {
                if (state.cart[id] > 0) {
                    itemsPayload.push({ id: id, jumlah: state.cart[id] });
                }
            }

            showLoading("Memproses Transaksi...");
            try {
                const now = new Date();
                const year = String(now.getFullYear()).slice(-2);
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const datePrefix = year + month + day;

                const { count } = await supabaseClient
                    .from('transaksi')
                    .select('*', { count: 'exact', head: true })
                    .like('id_transaksi', `K-${datePrefix}%`);

                let seq = (count || 0) + 1;
                
                const timestampStr = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                
                let statusTrx = "";
                if (pendingJenis === "Ambil") {
                    statusTrx = `Selesai pada ${timestampStr}`;
                } else {
                    statusTrx = `Dipinjam untuk ${tujuanVal} (${timestampStr})`;
                }

                let transaksiPayload = [];

                for (let itm of itemsPayload) {
                    let targetBarang = state.barang.find(b => b.id === itm.id);
                    if (targetBarang) {
                        let newStok = targetBarang.stok - itm.jumlah;
                        await supabaseClient
                            .from('barang')
                            .update({ stok: newStok })
                            .eq('id_barang', itm.id);

                        const customTrxId = `K-${datePrefix}${String(seq).padStart(4, '0')}`;
                        seq++;

                        transaksiPayload.push({
                            id_transaksi: customTrxId,
                            nip: state.user.nip,
                            nama_pengguna: state.user.nama,
                            id_barang: itm.id,
                            nama_barang: targetBarang.nama,
                            jumlah: itm.jumlah,
                            jenis_transaksi: pendingJenis,
                            status: statusTrx
                        });
                    }
                }

                if (transaksiPayload.length > 0) {
                    const { error: errTrx } = await supabaseClient.from('transaksi').insert(transaksiPayload);
                    if (errTrx) throw errTrx;
                }

                showToast(`Transaksi berhasil diproses!`);
                state.cart = {};
                await fetchAppData();
            } catch (err) {
                console.error(err);
                showToast("Gagal memproses transaksi.", true);
            } finally {
                hideLoading();
            }
        }

        let activeReturnTrxId = null;
        let maxReturnQty = 0;

        function openReturnModal(idTrx, namaBarang, maxQty) {
            activeReturnTrxId = idTrx;
            maxReturnQty = maxQty;
            document.getElementById('returnItemInfo').innerText = `Barang: ${namaBarang} (Maks. ${maxQty} unit)`;
            document.getElementById('returnQtyInput').value = maxQty;
            document.getElementById('returnQtyInput').max = maxQty;
            document.getElementById('returnModal').classList.remove('hidden');
            document.getElementById('returnModal').classList.add('flex');
        }

        function closeReturnModal() {
            document.getElementById('returnModal').classList.remove('flex');
            document.getElementById('returnModal').classList.add('hidden');
        }

        async function executeReturn() {
            let qty = Number(document.getElementById('returnQtyInput').value);
            if (qty <= 0 || qty > maxReturnQty) {
                showToast("Jumlah pengembalian tidak valid!", true);
                return;
            }

            closeReturnModal();
            showLoading("Memproses Pengembalian...");
            try {
                let trxObj = state.transaksi.find(t => t.idTransaksi === activeReturnTrxId);
                if (!trxObj) throw new Error("Transaksi tidak ditemukan.");

                const now = new Date();
                const timestampStr = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                
                let newStatus = "";
                if (qty === trxObj.jumlah) {
                    newStatus = state.user.isAdmin ? 
                        `Dikembalikan oleh Admin (${state.user.nama}) pada tanggal ${timestampStr}` : 
                        `Dikembalikan oleh peminjam pada tanggal ${timestampStr}`;
                } else {
                    newStatus = `Kembali sebagian (${qty}/${trxObj.jumlah}) pada ${timestampStr}`;
                }

                await supabaseClient
                    .from('transaksi')
                    .update({ status: newStatus })
                    .eq('id_transaksi', activeReturnTrxId);

                let targetBarang = state.barang.find(b => b.id === trxObj.idBarang);
                if (targetBarang) {
                    let updatedStok = targetBarang.stok + qty;
                    await supabaseClient
                        .from('barang')
                        .update({ stok: updatedStok })
                        .eq('id_barang', trxObj.idBarang);
                }

                showToast("Pengembalian barang berhasil dicatat!");
                await fetchAppData();
            } catch(err) {
                console.error(err);
                showToast("Gagal memproses pengembalian.", true);
            } finally {
                hideLoading();
            }
        }

        function renderPasswordContent() {
            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div class="h-full flex flex-col overflow-y-auto max-w-2xl mx-auto space-y-5 pr-1 w-full">
                    <section class="bg-gradient-to-br from-orange-500 to-amber-600 text-white rounded-2xl p-5 sm:p-7 shadow-lg shrink-0">
                        <div class="flex items-center gap-4 mb-5">
                            <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-white/20 flex items-center justify-center shrink-0"><i class="fa-solid fa-user text-2xl sm:text-3xl"></i></div>
                            <div class="min-w-0">
                                <p class="text-xs uppercase tracking-wider text-white/80">Profil Pegawai</p>
                                <h3 class="text-lg sm:text-xl font-bold break-words">${state.user.nama || '-'}</h3>
                                <p class="text-xs sm:text-sm text-white/90">${state.user.isAdmin ? 'Administrator' : 'Pegawai'}</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div class="rounded-xl bg-white/15 p-3 min-w-0"><p class="text-[10px] uppercase tracking-wider text-white/75">NIP</p><p class="text-sm font-semibold break-words">${state.user.nip || '-'}</p></div>
                            <div class="rounded-xl bg-white/15 p-3 min-w-0"><p class="text-[10px] uppercase tracking-wider text-white/75">Jabatan</p><p class="text-sm font-semibold break-words">${state.user.jabatan || '-'}</p></div>
                        </div>
                    </section>

                    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6 shrink-0">
                        <h3 class="text-base sm:text-lg font-bold text-slate-900 mb-2 flex items-center gap-2"><i class="fa-solid fa-key text-orange-500"></i> Ubah Password</h3>
                        <p class="text-xs text-slate-500 mb-6">Pastikan password baru Anda aman dan mudah diingat.</p>
                        <form onsubmit="handleChangePassword(event)" class="space-y-4">
                            <div><label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Password Lama</label><input type="password" id="oldPassword" required autocomplete="current-password" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"></div>
                            <div><label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Password Baru</label><input type="password" id="newPassword" required minlength="6" autocomplete="new-password" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"></div>
                            <button type="submit" class="w-full py-3.5 bg-orange-500 text-white font-medium rounded-xl hover:bg-orange-600 transition shadow-lg shadow-orange-500/20"><i class="fa-solid fa-floppy-disk mr-1"></i> Simpan Password Baru</button>
                        </form>
                    </section>

                    <section class="bg-white rounded-2xl border border-red-100 shadow-sm p-4 sm:p-5 shrink-0 mb-4">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                            <div><h3 class="text-sm font-bold text-slate-800">Keluar dari Akun</h3><p class="text-xs text-slate-500 mt-1">Akhiri sesi penggunaan aplikasi pada perangkat ini.</p></div>
                            <button onclick="handleLogout()" class="w-full sm:w-auto px-5 py-3 rounded-xl bg-red-50 text-red-600 hover:bg-red-100 font-semibold text-sm transition"><i class="fa-solid fa-right-from-bracket mr-2"></i>Logout</button>
                        </div>
                    </section>
                </div>`;
        }

        async function handleChangePassword(e) {
            e.preventDefault();
            const oldPassword = document.getElementById('oldPassword').value.trim();
            const newPassword = document.getElementById('newPassword').value.trim();

            showLoading("Memperbarui password...");
            try {
                const { data, error } = await supabaseClient
                    .from('pengguna')
                    .update({ password: newPassword })
                    .eq('nip', state.user.nip)
                    .eq('password', oldPassword)
                    .select();

                if (error) throw error;

                if (data && data.length > 0) {
                    showToast("Password berhasil diperbarui!");
                    document.getElementById('oldPassword').value = '';
                    document.getElementById('newPassword').value = '';
                } else {
                    showToast("Password lama tidak sesuai!", true);
                }
            } catch(err) {
                console.error(err);
                showToast("Gagal memperbarui password.", true);
            } finally {
                hideLoading();
            }
        }

        function isHanyaPinjamInCart() {
            for (let id in state.cart) {
                if (state.cart[id] > 0) {
                    let item = state.barang.find(b => b.id === id);
                    if (item && item.hanyaPinjam) return true;
                }
            }
            return false;
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMsg');
            msgEl.innerText = msg;
            toast.className = `fixed bottom-5 right-5 left-5 md:left-auto z-50 text-white px-5 py-3 rounded-xl shadow-xl text-sm flex items-center justify-center md:justify-start gap-3 transition-all duration-300 ${isError ? 'bg-red-600' : 'bg-slate-900'}`;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3500);
        }

        window.onload = () => {
            if (state.user) {
                fetchAppData();
                initRealtimeListener();
            } else {
                render();
            }
        };
    </script>
</body>
</html>
