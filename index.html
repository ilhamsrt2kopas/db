        function formatIndonesianDateTime(isoString) {
            if (!isoString || isoString === '-') return '-';
            const clean = isoString.replace('T', ' ');
            const date = new Date(clean);
            if (isNaN(date.getTime())) return isoString;
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            const dayName = days[date.getDay()];
            const dayNum = String(date.getDate()).padStart(2, '0');
            const monthName = months[date.getMonth()];
            const year = date.getFullYear();
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${dayName}, ${dayNum} ${monthName} ${year} - ${hours}:${minutes}`;
        }

        function getJenjang(kelas) {
            const num = parseInt(kelas) || 0;
            if (num >= 1 && num <= 6) return 'SRD';
            if (num >= 7 && num <= 9) return 'SRMP';
            if (num >= 10 && num <= 12) return 'SRMA';
            return 'Data Kelas Belum Terdaftar';
        }

        // Peran penandatangan Wali Asuh / Wali Asrama sesuai jenjang siswa (mis. "Wali Asuh/Wali Asrama SRD")
        function getWaliAsuhRole(kelas) {
            const j = getJenjang(kelas);
            return ['SRD', 'SRMP', 'SRMA'].includes(j) ? `Wali Asuh/Wali Asrama ${j}` : 'Wali Asuh/Wali Asrama';
        }

        function sortStudents(a, b) {
            const kA = parseInt(a.kelas) || 0;
            const kB = parseInt(b.kelas) || 0;
            if (kA !== kB) return kA - kB;
            const rA = String(a.rombel || '').localeCompare(String(b.rombel || ''), undefined, {numeric: true});
            if (rA !== 0) return rA;
            return String(a.nama || '').localeCompare(String(b.nama || ''));
        }

        async function fetchAppData(silent = false) {
            if (!silent) showLoading("Mengambil data dari Database...");
            state.cart = {};
            state.addStockCart = {};

            try {
                const { data: dataBarang, error: errBarang } = await supabaseClient.from('barang').select('*').order('nama_barang', { ascending: true });
                if (errBarang) throw errBarang;

                const { data: dataTrx, error: errTrx } = await supabaseClient.from('transaksi').select('*').order('id_transaksi', { ascending: false });
                if (errTrx) throw errTrx;

                const { data: dataMasuk, error: errMasuk } = await supabaseClient.from('masuk').select('*').order('id_input', { ascending: false });
                if (errMasuk) throw errMasuk;

                const { data: dataSiswa, error: errSiswa } = await supabaseClient.from('siswa').select('*');
                if (errSiswa) console.warn("Tabel siswa belum tersedia:", errSiswa);

                const { data: dataIzin, error: errIzin } = await supabaseClient.from('perizinan_siswa').select('*').order('id_izin', { ascending: false });
                if (errIzin) console.warn("Tabel perizinan_siswa belum tersedia:", errIzin);

                const { data: dataPengguna } = await supabaseClient.from('pengguna').select('nip, nama, jabatan, tugas');
                state.penggunaList = dataPengguna || [];
                const penggunaByNip = Object.fromEntries((state.penggunaList).map(p => [
                    String(p.nip || ''), { nama: p.nama || '', jabatan: p.jabatan || 'Pegawai', tugas: p.tugas || '' }
                ]));

                if (state.user && penggunaByNip[String(state.user.nip || '')]) {
                    state.user.tugas = penggunaByNip[String(state.user.nip || '')].tugas || state.user.tugas || '';
                }

                state.barang = (dataBarang || []).map(b => ({
                    id: b.id_barang || b.id,
                    sumberPerolehan: b.sumber_perolehan || '',
                    kategori: b.kategori || 'ATK',
                    nama: b.nama_barang || b.nama || '',
                    stok: Number(b.stok || 0),
                    hanyaPinjam: Boolean(b.hanya_pinjam)
                }));

                state.siswa = (dataSiswa || []).map(s => ({
                    nisn: String(s.nisn || ''),
                    nama: String(s.nama_siswa || ''),
                    kelas: String(s.kelas || ''),
                    rombel: String(s.rombel || ''),
                    tempatLahir: String(s.tempat_lahir || ''),
                    tanggalLahir: String(s.tanggal_lahir || ''),
                    namaOrtuWali: String(s.nama_ortu_wali || ''),
                    alamat: String(s.alamat || ''),
                    kamar: String(s.kamar || '')
                })).sort(sortStudents);

                const todayStr = new Date().toISOString().split('T')[0];
                state.transaksi = (dataTrx || []).map(t => {
                    const idTrxStr = String(t.id_transaksi || '');
                    let trxDateStr = todayStr;
                    if (idTrxStr.length >= 8) {
                        const cleanId = idTrxStr.replace(/^K-/, '');
                        if (cleanId.length >= 6) {
                            trxDateStr = `20${cleanId.slice(0, 2)}-${cleanId.slice(2, 4)}-${cleanId.slice(4, 6)}`;
                        }
                    }
                    return {
                        idTransaksi: t.id_transaksi || t.id,
                        nip: t.nip || '',
                        namaPengguna: t.nama_pengguna || t.nama || penggunaByNip[String(t.nip || '')]?.nama || 'Pengguna',
                        jabatan: penggunaByNip[String(t.nip || '')]?.jabatan || 'Pegawai',
                        idBarang: t.id_barang,
                        namaBarang: t.nama_barang || 'Barang',
                        jumlah: Number(t.jumlah || 0),
                        jenis: t.jenis_transaksi || t.jenis || '',
                        status: t.status || '',
                        tanggal: trxDateStr,
                        isToday: (trxDateStr === todayStr)
                    };
                });

                state.masuk = (dataMasuk || []).map(m => {
                    const idInputStr = String(m.id_input || '');
                    let masukDateStr = todayStr;
                    if (idInputStr.length >= 8) {
                        const cleanId = idInputStr.replace(/^M-/, '');
                        if (cleanId.length >= 6) {
                            const yy = '20' + cleanId.slice(0, 2);
                            const mm = cleanId.slice(2, 4);
                            const dd = cleanId.slice(4, 6);
                            masukDateStr = `${yy}-${mm}-${dd}`;
                        }
                    }
                    return {
                        idInput: m.id_input || '',
                        idBarang: m.id_barang || '',
                        namaBarang: m.nama_barang || 'Barang',
                        jumlah: Number(m.jumlah || 0),
                        tanggal: masukDateStr
                    };
                });

                state.perizinanSiswa = (dataIzin || []).map(i => {
                    const siswaObj = state.siswa.find(s => s.nisn === String(i.nisn));
                    return {
                        idIzin: i.id_izin || i.id,
                        nip: i.nip || '',
                        nisn: i.nisn || '',
                        namaSiswa: siswaObj ? siswaObj.nama : 'Siswa (' + i.nisn + ')',
                        kelas: i.kelas || (siswaObj ? siswaObj.kelas : '-'),
                        rombel: siswaObj ? siswaObj.rombel : '',
                        kamar: siswaObj ? (siswaObj.kamar || '') : '',
                        keperluan: i.keperluan || '-',
                        keterangan: i.keterangan || '-',
                        waktuKeluar: i.waktu_keluar || '-',
                        waktuKembali: i.waktu_kembali || '-',
                        realisasi: i.realisasi || '-',
                        returnDetails: buildReturnDetails(i),
                        receiverInfo: normalizeReceiverInfo(i.receiver_info ?? i.receiverInfo),
                        status: i.status || 'Pending',
                        signatures: parseJsonField(i.signatures) || {}
                    };
                });

                render();
            } catch (err) {
                console.error("Database error:", err);
                if (!silent) showToast("Gagal memuat data dari Database.", true);
            } finally {
                if (!silent) hideLoading();
            }
        }

        function initRealtimeListener() {
            if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
            realtimeChannel = supabaseClient.channel('public-db-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'barang' }, () => fetchAppData(true))
                .on('postgres_changes', { event: '*', schema: 'public', table: 'transaksi' }, () => fetchAppData(true))
                .on('postgres_changes', { event: '*', schema: 'public', table: 'masuk' }, () => fetchAppData(true))
                .on('postgres_changes', { event: '*', schema: 'public', table: 'siswa' }, () => fetchAppData(true))
                .on('postgres_changes', { event: '*', schema: 'public', table: 'perizinan_siswa' }, () => fetchAppData(true))
                .subscribe();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const nip = document.getElementById('nip').value.trim();
            const password = document.getElementById('password').value.trim();
            showLoading("Memverifikasi Login...");
            try {
                const { data, error } = await supabaseClient.from('pengguna').select('*').eq('nip', nip).eq('password', password).maybeSingle();
                if (error) throw error;
                if (data) {
                    const userData = {
                        nip: data.nip,
                        nama: data.nama,
                        jabatan: data.jabatan,
                        tugas: data.tugas || '',
                        isAdmin: Boolean(data.is_admin)
                    };
                    state.user = userData;
                    state.activeTab = 'dashboard';
                    localStorage.setItem('sr_user', JSON.stringify(userData));
                    showToast("Login berhasil!");
                    await fetchAppData();
                    initRealtimeListener();
                } else {
                    showToast("NIP atau Password salah!", true);
                }
            } catch (err) {
                console.error(err);
                showToast("Terjadi kesalahan koneksi login.", true);
            } finally {
                hideLoading();
            }
        }

            if (realtimeChannel) {
                supabaseClient.removeChannel(realtimeChannel);

                            }

        // --- HELPER STATUS PERIZINAN ---
        function isIzinSelesai(p) {
            const st = String(p.status || '').toLowerCase();
            return st.includes('selesai') || st.includes('kembali') || !!(p.realisasi && p.realisasi !== '-');
        }

        // Status tampilan: Pending (belum lengkap ditandatangani), Aktif (sedang izin), Selesai (sudah kembali)
        function getIzinStatusLabel(p) {
            if (isIzinSelesai(p)) return 'Selesai';
            const sigs = Object.values(p.signatures || {});
            const allSigned = sigs.length > 0 && sigs.every(sg => sg.status === 'Disetujui');
            return allSigned ? 'Aktif' : 'Pending';
        }

        // NISN siswa yang masih memiliki izin berjalan (Pending / Aktif)
        function getSiswaDenganIzinAktif() {
            return new Set(state.perizinanSiswa.filter(p => !isIzinSelesai(p)).map(p => String(p.nisn)));
        }

        function formatShortDateTime(isoString) {
            if (!isoString || isoString === '-') return '-';
            const d = new Date(String(isoString).replace('T', ' '));
            if (isNaN(d.getTime())) return isoString;
            const mon = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getDate())} ${mon[d.getMonth()]} ${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        const KEPERLUAN_LABEL = {
            'kepulangan panjang': 'Kepulangan Panjang',
            'pemeriksaan kesehatan': 'Pemeriksaan Kesehatan',
            'meninggalkan asrama': 'Meninggalkan Asrama',
            'meninggalkan sekolah': 'Meninggalkan Sekolah'
        };

        function renderSiswaJenjangList() {
            const query = (state.izinSearchSiswa || '').toLowerCase();
            const sedangIzin = getSiswaDenganIzinAktif();
            // Siswa yang masih memiliki izin berjalan tidak bisa dipilih lagi
            state.izinSelectedSiswa = state.izinSelectedSiswa.filter(n => !sedangIzin.has(String(n)));
            const hiddenCount = state.siswa.filter(s => sedangIzin.has(s.nisn)).length;
            const filtered = state.siswa.filter(s => !sedangIzin.has(s.nisn) && (s.nama.toLowerCase().includes(query) || s.nisn.includes(query) || s.kelas.toLowerCase().includes(query)));
            const hiddenNote = hiddenCount > 0
                ? `<p class="text-[11px] text-slate-500 bg-orange-50 border border-orange-100 rounded-lg px-2.5 py-1.5 mb-2"><i class="fa-solid fa-circle-info text-orange-500"></i> ${hiddenCount} siswa disembunyikan karena masih memiliki izin yang belum selesai.</p>`
                : '';
            if (filtered.length === 0) return hiddenNote + '<p class="text-xs text-slate-400 text-center py-4">Tidak ada data siswa yang dapat diajukan.</p>';

            const JENJANG_ORDER = ['SRD', 'SRMP', 'SRMA', 'Data Kelas Belum Terdaftar'];
            const JENJANG_KELAS = { SRD: '1-6', SRMP: '7-9', SRMA: '10-12' };
            const groups = { 'SRD': [], 'SRMP': [], 'SRMA': [], 'Data Kelas Belum Terdaftar': [] };
            filtered.forEach(s => {
                const j = getJenjang(s.kelas);
                if (groups[j]) groups[j].push(s);
                else groups['Data Kelas Belum Terdaftar'].push(s);
            });

            let html = hiddenNote;
            JENJANG_ORDER.forEach(jName => {
                const list = groups[jName];
                if (list.length === 0) return;
                html += `<div class="mb-2"><p class="text-[11px] font-bold text-orange-600 uppercase tracking-wider mb-1 border-b pb-0.5">${JENJANG_KELAS[jName] ? `Jenjang ${jName} (Kelas ${JENJANG_KELAS[jName]})` : jName}</p>`;
                list.forEach(s => {
                    const isChecked = state.izinSelectedSiswa.includes(s.nisn);
                    html += `
                        <label class="flex items-center gap-2 p-1.5 hover:bg-white rounded-lg cursor-pointer transition">
                            <input type="checkbox" value="${s.nisn}" ${isChecked ? 'checked' : ''} onchange="toggleSelectSiswa('${s.nisn}')" class="w-4 h-4 text-orange-500 rounded">
                            <span class="text-xs font-medium text-slate-800">${s.nama} (Kelas ${s.kelas}-${s.rombel || '-'}) - ${s.nisn}</span>
                        </label>
                    `;
                });
                html += `</div>`;
            });
            return html;
        }

        function handleSiswaSearchInput(val) {
            state.izinSearchSiswa = val;
            const container = document.getElementById('siswaListContainer');
            if (container) container.innerHTML = renderSiswaJenjangList();
        }

        function handleWaktuKeluarChange(val) {
            const keluarVal = document.getElementById('waktuKeluarInput').value;
            const kembaliInput = document.getElementById('waktuKembaliInput');
            if (keluarVal) {
                kembaliInput.min = keluarVal;
                const timePart = keluarVal.split('T')[1] || '';
                if (timePart) {
                    const [h, m] = timePart.split(':').map(Number);
                    const totalMins = h * 60 + m;
                    const selectEl = document.getElementById('izinKeperluanSelect');
                    if (selectEl) {
                        const opts = selectEl.options;
                        for (let i = 0; i < opts.length; i++) {
                            if (opts[i].value === 'meninggalkan sekolah') {
                                if (totalMins >= 870 || totalMins < 420) {
                                    opts[i].disabled = true;
                                    if (selectEl.value === 'meninggalkan sekolah') selectEl.value = 'meninggalkan asrama';
                                } else {
                                    opts[i].disabled = false;
                                }
                            } else if (opts[i].value === 'meninggalkan asrama') {
                                if (totalMins >= 420 && totalMins < 870) {
                                    opts[i].disabled = true;
                                    if (selectEl.value === 'meninggalkan asrama') selectEl.value = 'meninggalkan sekolah';
                                } else {
                                    opts[i].disabled = false;
                                }
                            }
                        }
                        state.izinKeperluan = selectEl.value;
                    }
                }
            }
            handleWaktuKembaliChange(kembaliInput.value);
        }

        function handleWaktuKembaliChange(val) {
            const keluarVal = document.getElementById('waktuKeluarInput').value;
            const kembaliInput = document.getElementById('waktuKembaliInput');
            if (keluarVal && val && val < keluarVal) {
                showToast("Waktu kembali tidak boleh kurang dari waktu keberangkatan!", true);
                kembaliInput.value = keluarVal;
                val = keluarVal;
            }

            if (val) {
                state.izinWaktuKembali = val;
                const kembaliDate = new Date(val);
                const now = new Date();
                const diffHours = (kembaliDate - now) / (1000 * 60 * 60);
                if (diffHours > 24) {
                    state.izinKeperluan = 'kepulangan panjang';
                    state.isLockedKeperluan = true;
                    showToast("Estimasi > 24 jam: Jenis izin terkunci menjadi Kepulangan Panjang.");
                } else {
                    state.isLockedKeperluan = false;
                }
                const selectEl = document.getElementById('izinKeperluanSelect');
                if (selectEl) {
                    selectEl.value = state.izinKeperluan;
                    selectEl.disabled = state.isLockedKeperluan;
                }
            }
            updateRolesInfo();
        }

        function updateRolesInfo() {
            const rolesText = document.getElementById('rolesInfoText');
            if (rolesText) {
                if (state.izinSelectedSiswa.length > 0) {
                    const firstSiswa = state.siswa.find(s => s.nisn === state.izinSelectedSiswa[0]);
                    const k = firstSiswa ? firstSiswa.kelas : '';
                    const r = firstSiswa ? firstSiswa.rombel : '';
                    const kRStr = k && r ? `${k}-${r}` : (k ? k : '');
                    
                    let roles = [];
                    if (state.izinKeperluan === 'meninggalkan sekolah') roles = ['Waka Kesiswaan', kRStr ? `Wali Kelas ${kRStr}` : 'Wali Kelas'];
                    else if (state.izinKeperluan === 'pemeriksaan kesehatan') roles = ['Kepala UKSR', 'Tenaga Kesehatan'];
                    else if (state.izinKeperluan === 'meninggalkan asrama') roles = ['Waka Keasramaan', getWaliAsuhRole(k)];
                    else if (state.izinKeperluan === 'kepulangan panjang') roles = ['Waka Kesiswaan', 'Waka Keasramaan', kRStr ? `Wali Kelas ${kRStr}` : 'Wali Kelas'];
                    else roles = [kRStr ? `Wali Kelas ${kRStr}` : 'Wali Kelas'];

                    rolesText.innerHTML = `Peran penandatangan: <b>${roles.join(', ')}</b>`;
                } else {
                    rolesText.innerHTML = `Pilih minimal 1 siswa untuk melihat detail peran penandatangan.`;
                }
            }
        }

        function openCreateIzinModal() {
            state.izinSelectedSiswa = [];
            state.izinSearchSiswa = '';
            const siswaBox = document.getElementById('siswaListContainer');
            if (siswaBox) siswaBox.innerHTML = renderSiswaJenjangList();
            state.isLockedKeperluan = false;
            document.getElementById('createIzinModal').classList.remove('hidden');
            document.getElementById('createIzinModal').classList.add('flex');
            updateRolesInfo();
        }

        function closeCreateIzinModal() {
            state.izinSelectedSiswa = [];
            document.getElementById('createIzinModal').classList.remove('flex');
            document.getElementById('createIzinModal').classList.add('hidden');
        }

        function toggleSelectSiswa(nisn) {
            if (state.izinSelectedSiswa.includes(nisn)) {
                state.izinSelectedSiswa = state.izinSelectedSiswa.filter(n => n !== nisn);
            } else {
                state.izinSelectedSiswa.push(nisn);
            }
            updateRolesInfo();
        }

        async function submitPerizinan(e) {
            e.preventDefault();
            const waktuKeluar = document.getElementById('waktuKeluarInput').value;
            const waktuKembali = document.getElementById('waktuKembaliInput').value;
            const keterangan = document.getElementById('izinKeteranganInput').value.trim();

            if (!waktuKeluar || !waktuKembali) {
                showToast("Waktu keluar dan estimasi waktu kembali harus diisi!", true);
                return;
            }
            if (waktuKembali < waktuKeluar) {
                showToast("Waktu kembali tidak boleh kurang dari waktu keberangkatan!", true);
                return;
            }
            if (!keterangan) {
                showToast("Keterangan izin keluar harus diisi!", true);
                return;
            }
            if (state.izinSelectedSiswa.length === 0) {
                showToast("Pilih minimal 1 siswa!", true);
                return;
            }

            showLoading("Menyimpan perizinan...");
            try {
                const { data: existingIzin, error: cekErr } = await supabaseClient
                    .from('perizinan_siswa')
                    .select('nisn, status, realisasi')
                    .in('nisn', state.izinSelectedSiswa);
                if (cekErr) throw new Error(cekErr.message);
                const blocked = (existingIzin || []).filter(r => {
                    const st = String(r.status || '').toLowerCase();
                    return !(st.includes('selesai') || st.includes('kembali') || r.realisasi);
                }).map(r => String(r.nisn));
                if (blocked.length > 0) {
                    const names = [...new Set(blocked)].map(n => (state.siswa.find(x => x.nisn === n) || {}).nama || n).join(', ');
                    state.izinSelectedSiswa = state.izinSelectedSiswa.filter(n => !blocked.includes(String(n)));
                    const box = document.getElementById('siswaListContainer');
                    if (box) box.innerHTML = renderSiswaJenjangList();
                    throw new Error("Siswa masih memiliki izin yang belum selesai: " + names);
                }

                const now = new Date();
                const yy = String(now.getFullYear()).slice(-2);
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const dd = String(now.getDate()).padStart(2, '0');
                const datePrefix = yy + mm + dd;

                let prefix = 'IS';
                if (state.izinKeperluan.includes('asrama')) prefix = 'IA';
                else if (state.izinKeperluan.includes('kesehatan')) prefix = 'IK';
                else if (state.izinKeperluan.includes('kepulangan')) prefix = 'IP';

                for (let i = 0; i < state.izinSelectedSiswa.length; i++) {
                    const nisn = state.izinSelectedSiswa[i];
                    const siswaObj = state.siswa.find(s => s.nisn === nisn);
                    const kRStr = siswaObj && siswaObj.kelas && siswaObj.rombel ? `${siswaObj.kelas}-${siswaObj.rombel}` : (siswaObj && siswaObj.kelas ? siswaObj.kelas : '');

                    const getRoles = (keperluan) => {
                        switch(keperluan) {
                            case 'meninggalkan sekolah': return ['Waka Kesiswaan', kRStr ? `Wali Kelas ${kRStr}` : 'Wali Kelas'];
                            case 'pemeriksaan kesehatan': return ['Kepala UKSR', 'Tenaga Kesehatan'];
                            case 'meninggalkan asrama': return ['Waka Keasramaan', getWaliAsuhRole(siswaObj ? siswaObj.kelas : '')];
                            case 'kepulangan panjang': return ['Waka Kesiswaan', 'Waka Keasramaan', kRStr ? `Wali Kelas ${kRStr}` : 'Wali Kelas'];
                            default: return [kRStr ? `Wali Kelas ${kRStr}` : 'Wali Kelas'];
                        }
                    };

                    let roles = getRoles(state.izinKeperluan);
                    let initialSigs = {};
                    roles.forEach(r => { initialSigs[r] = { nama: '-', nip: '-', status: 'Pending' }; });
                    
                    const { count } = await supabaseClient
                        .from('perizinan_siswa')
                        .select('*', { count: 'exact', head: true })
                        .like('id_izin', `${prefix}${datePrefix}%`);

                    let seq = (count || 0) + 1 + i;
                    const idIzin = `${prefix}${datePrefix}${String(seq).padStart(3, '0')}`;

                    const payload = {
                        id_izin: idIzin,
                        nip: state.user.nip,
                        nisn: nisn,
                        kelas: siswaObj ? siswaObj.kelas : '-',
                        rombel: siswaObj ? siswaObj.rombel : '-',
                        keperluan: state.izinKeperluan,
                        keterangan: keterangan,
                        waktu_keluar: waktuKeluar,
                        waktu_kembali: waktuKembali,
                        realisasi: null,
                        status: 'Pending',
                        signatures: initialSigs
                    };

                    const { error: insertErr } = await supabaseClient.from('perizinan_siswa').insert([payload]);
                    if (insertErr) throw new Error(insertErr.message);
                }

                showToast("Perizinan siswa berhasil diajukan!");
                state.izinSelectedSiswa = [];
                closeCreateIzinModal();
                await fetchAppData();
            } catch (err) {
                console.error(err);
                showToast("Gagal menyimpan perizinan: " + err.message, true);
            } finally {
                hideLoading();
            }
        }

        // --- SIGN MODAL LOGIC ---

        // --- HELPER DATA PERIZINAN (JSON, PENANDATANGAN, PENERIMA) ---
        function parseJsonField(v) {
            let x = v;
            for (let n = 0; n < 3 && typeof x === 'string'; n++) {
                const t = x.trim();
                if (!t) return null;
                try { x = JSON.parse(t); } catch (e) { return null; }
            }
            return (x && typeof x === 'object') ? x : null;
        }

        function normalizeReturnDetails(v) {
            const o = parseJsonField(v);
            if (!o) return null;
            return {
                pengantar: String(o.pengantar || o.nama_pengantar || o.pengantar_nama || '').trim(),
                catatan: String(o.catatan || o.keterangan || o.note || '').trim(),
                pengantar_tipe: String(o.pengantar_tipe || '').trim(),
                pengantar_jabatan: String(o.pengantar_jabatan || '').trim(),
                pengantar_nip: String(o.pengantar_nip || '').trim(),
                pengantar_hubungan: String(o.pengantar_hubungan || '').trim()
            };
        }

        // Gabungkan kolom pengantar & catatan (tabel perizinan_siswa) dengan metadata di return_details
        function buildReturnDetails(row) {
            const rd = normalizeReturnDetails(row.return_details ?? row.returnDetails);
            const pengantarCol = String(row.pengantar ?? '').trim();
            const catatanCol = String(row.catatan ?? '').trim();
            if (!rd && !pengantarCol && !catatanCol) return null;
            const base = rd || { pengantar: '', catatan: '', pengantar_tipe: '', pengantar_jabatan: '', pengantar_nip: '', pengantar_hubungan: '' };
            return { ...base, pengantar: pengantarCol || base.pengantar, catatan: catatanCol || base.catatan };
        }

        function normalizeReceiverInfo(v) {
            const o = parseJsonField(v);
            if (!o) return null;
            return {
                nama: String(o.nama || o.nama_pegawai || o.name || '').trim(),
                nip: String(o.nip || '').trim(),
                tugas: String(o.tugas || o.jabatan || '').trim()
            };
        }

        function findPenggunaByNip(nip) {
            return (state.penggunaList || []).find(u => String(u.nip) === String(nip)) || null;
        }

        // Memecah tugas seperti "Wali Kelas 7-A, Pembina Pramuka" menjadi bagian-bagian
        // Peran pegawai: kolom tugas; jika kosong gunakan kolom jabatan
        function tugasSource(user) {
            if (!user) return '';
            const t = String(user.tugas || '').trim();
            return t || String(user.jabatan || '').trim();
        }

        function splitTugas(t) {
            return String(t || '').split(/\s*(?:,|;|\/|&|\n|\bdan\b)\s*/i).map(x => x.trim()).filter(Boolean);
        }

        function segmentMatchesRole(seg, roleName, kelas, rombel) {
            const s = seg.toLowerCase();
            const r = String(roleName || '').toLowerCase();
            if (r.includes('wali kelas')) {
                const re = /kelas\s*(\d{1,2})(?:\s*[-–.]?\s*([a-z0-9]{1,2})(?![a-z0-9]))?/;
                const m = s.match(re);
                if (!m) return false;
                // Kelas & rombel target: dari nama peran (mis. "Wali Kelas 1-1"); jika tidak ada, dari data siswa
                const rm = r.match(re);
                let tKelas = rm ? rm[1] : kelas;
                let tRombel = rm && rm[2] ? rm[2] : String(rombel || '').toLowerCase();
                if (!rm || !rm[2]) {
                    const stripped = tRombel.replace(new RegExp('^' + parseInt(tKelas) + '\\s*[-–.]?\\s*'), '');
                    if (stripped) tRombel = stripped;
                }
                if (parseInt(m[1]) !== parseInt(tKelas)) return false;
                if (m[2]) return m[2] === String(tRombel).toLowerCase();
                return true;
            }
            if (r.includes('petugas kesehatan') || r.includes('kesehatan') || r.includes('nakes')) {
                return s.includes('petugas kesehatan') || s.includes('kesehatan') || s.includes('nakes');
            }
            if (r.includes('kepala uksr') || r.includes('uks')) {
                return s.includes('kepala uksr') || s.includes('uksr') || s.includes('uks');
            }
            if (r.includes('waka kesiswaan')) {
                return s.includes('waka kesiswaan') || (s.includes('waka') && s.includes('kesiswaan'));
            }
            if (r.includes('waka keasramaan')) {
                return s.includes('waka keasramaan') || (s.includes('waka') && (s.includes('asrama') || s.includes('keasramaan')));
            }
            if (r.includes('wali asuh') || r.includes('wali asrama')) {
                if (!(s.includes('wali asuh') || s.includes('wali asrama'))) return false;
                // Jenjang target: dari nama peran, jika tidak ada dari kelas siswa
                const tok = x => (String(x).toLowerCase().match(/\b(srd|srmp|srma)\b/) || [])[1] || null;
                const target = tok(r) || tok(getJenjang(kelas));
                const segJ = tok(s);
                if (segJ && target && segJ !== target) return false;
                return true;
            }
            return s.includes(r);
        }

        // Mengembalikan bagian tugas pegawai yang cocok dengan peran (atau null)
        function findRoleSegment(user, roleName, kelas, rombel) {
            if (!user) return null;
            const segs = splitTugas(tugasSource(user));
            return segs.find(sg => segmentMatchesRole(sg, roleName, kelas, rombel)) || null;
        }

        function userMatchesRole(user, roleName, kelas, rombel) {
            return !!findRoleSegment(user, roleName, kelas, rombel);
        }

        // Urutan penandatangan pada surat izin (kiri -> kanan) per jenis izin.
        // Diurutkan secara eksplisit karena urutan kunci JSON dari database tidak terjamin.
        const SIGNER_ORDER = {
            'meninggalkan sekolah': ['waka kesiswaan', 'wali kelas'],
            'meninggalkan asrama': ['waka keasramaan', 'wali asuh|wali asrama'],
            'pemeriksaan kesehatan': ['kepala uks', 'kesehatan'],
            'kepulangan panjang': ['waka kesiswaan', 'waka keasramaan', 'wali kelas']
        };

        function orderSignerRoles(izin) {
            const keys = Object.keys(izin.signatures || {});
            const patterns = SIGNER_ORDER[String(izin.keperluan || '').toLowerCase()] || [];
            const rank = key => {
                const k = key.toLowerCase();
                const i = patterns.findIndex(pt => pt.split('|').some(x => k.includes(x)));
                return i === -1 ? 99 : i;
            };
            return keys.map((k, i) => ({ k, i, r: rank(k) })).sort((a, b) => a.r - b.r || a.i - b.i).map(x => x.k);
        }

        // Data penandatangan yang akan dicetak pada surat izin (nama, NIP, jabatan sebenarnya)
        function resolveSigner(izin, roleName) {
            const sig = (izin.signatures || {})[roleName] || {};
            let nama = String(sig.nama || '').trim();
            let nip = String(sig.nip || '').trim();
            let jabatan = String(sig.jabatan || '').trim();
            const u = nip && nip !== '-' ? findPenggunaByNip(nip) : null;
            if (u) {
                if (!nama) nama = u.nama || '';
                if (!jabatan) jabatan = findRoleSegment(u, roleName, izin.kelas, izin.rombel) || tugasSource(u);
            }
            return {
                nama: nama || '-',
                nip: nip || '-',
                jabatan: jabatan || roleName,
                status: sig.status
            };
        }

        // Data pegawai penerima pada surat keterangan kembali
        function resolveReceiver(izin) {
            const info = izin.receiverInfo || {};
            let nama = info.nama || '';
            let nip = info.nip || '';
            let tugas = info.tugas || '';
            const u = nip ? findPenggunaByNip(nip) : null;
            if (u) {
                if (!nama) nama = u.nama || '';
                if (!tugas) tugas = tugasSource(u);
            }
            return { nama, nip, tugas };
        }

        // Apakah pengguna berwenang menandatangani salah satu peran pada izin ini
        function userCanSignIzin(izin, user) {
            if (!izin || !user) return false;
            if (user.isAdmin) return true;
            const siswaObj = state.siswa.find(x => x.nisn === String(izin.nisn)) || {};
            const kelas = siswaObj.kelas || izin.kelas || '';
            const rombel = siswaObj.rombel || izin.rombel || '';
            return Object.keys(izin.signatures || {}).some(role => userMatchesRole(user, role, kelas, rombel));
        }

        // Apakah tombol tanda tangan perlu ditampilkan untuk pengguna saat ini
        function canUserSignNow(izin) {
            const sigs = izin.signatures || {};
            const allSigned = Object.values(sigs).length > 0 && Object.values(sigs).every(sg => sg.status === 'Disetujui');
            if (allSigned || isIzinSelesai(izin) || !userCanSignIzin(izin, state.user)) return false;
            const siswaObj = state.siswa.find(x => x.nisn === String(izin.nisn)) || {};
            const kelas = siswaObj.kelas || izin.kelas || '';
            const rombel = siswaObj.rombel || izin.rombel || '';
            const roleKey = Object.keys(sigs).find(role => userMatchesRole(state.user, role, kelas, rombel));
            return !(roleKey && sigs[roleKey]?.status === 'Disetujui');
        }

        function openSignModal(idIzin) {
            activeSignIdIzin = idIzin;
            const izin = state.perizinanSiswa.find(p => p.idIzin === idIzin);
            if (!izin) return;
            const sigs = izin.signatures || {};
            const userTugas = tugasSource(state.user).toLowerCase();
            const siswaObj = state.siswa.find(s => s.nisn === String(izin.nisn)) || {};
            const kelasSiswa = siswaObj.kelas || izin.kelas || '';
            const rombelSiswa = siswaObj.rombel || izin.rombel || '';
            const kelasRombelStr = kelasSiswa && rombelSiswa ? `${kelasSiswa}-${rombelSiswa}`.toLowerCase() : '';

            let targetRole = '';
            if (!state.user.isAdmin) {
                let matchedRole = Object.keys(sigs).find(role => userMatchesRole(state.user, role, kelasSiswa, rombelSiswa));
                if (!matchedRole) {
                    activeSignIdIzin = null;
                    showToast("Anda tidak berwenang menandatangani dokumen ini.", true);
                    return;
                }
                targetRole = matchedRole;
            }

            const knownRole = (r) => ['wali kelas', 'kesehatan', 'nakes', 'uks', 'waka', 'wali asuh', 'wali asrama'].some(k => r.toLowerCase().includes(k));
            const filterPenggunaByRole = (roleName) => {
                if (!knownRole(roleName)) return state.penggunaList;
                return state.penggunaList.filter(u => userMatchesRole(u, roleName, kelasSiswa, rombelSiswa));
            };

            let html = '';
            if (state.user.isAdmin) {
                let availableRoles = Object.keys(sigs);
                const adminSelf = `<option value="__self__" data-nama="${state.user.nama}">Atas nama saya (${state.user.nama})</option>`;
                const optionLabel = (u, role) => {
                    const seg = findRoleSegment(u, role, kelasSiswa, rombelSiswa) || tugasSource(u) || 'Pegawai';
                    return `<option value="${u.nip}" data-nama="${u.nama}">${u.nama} (${seg}) - NIP: ${u.nip}</option>`;
                };
                html = `
                    <div class="space-y-3">
                        <label class="block text-xs font-semibold uppercase text-slate-500">Pilih Peran yang Ingin Ditandatangani (Bisa > 1)</label>
                        <p class="text-[11px] text-slate-400">Untuk setiap peran, pilih pegawai yang menandatangani. Pilih "Atas nama saya" jika tidak ada pegawai yang sesuai.</p>
                        <div class="space-y-2 max-h-64 overflow-y-auto p-2 bg-slate-50 border rounded-xl">
                            ${availableRoles.map(r => {
                                const signed = sigs[r] && sigs[r].status === 'Disetujui';
                                const eligible = knownRole(r) ? filterPenggunaByRole(r) : state.penggunaList;
                                const defaultSelf = !knownRole(r) || eligible.length === 0;
                                return `
                                <div class="p-2 bg-white border border-slate-200 rounded-lg space-y-1.5">
                                    <label class="flex items-center gap-2 text-xs font-medium text-slate-700 cursor-pointer">
                                        <input type="checkbox" name="adminRoleCheckbox" value="${r}" ${signed ? '' : 'checked'} class="w-4 h-4 text-orange-500 rounded">
                                        <span>${r}</span>
                                        ${signed ? '<span class="px-1.5 py-0.5 bg-green-100 text-green-700 rounded text-[9px] font-bold">Sudah ditandatangani</span>' : ''}
                                    </label>
                                    <select data-admin-signer="${r}" class="w-full px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                                        ${eligible.map((u, i) => optionLabel(u, r).replace('<option ', `<option ${(!defaultSelf && i === 0) ? 'selected ' : ''}`)).join('')}
                                        ${adminSelf.replace('<option ', `<option ${defaultSelf ? 'selected ' : ''}`)}
                                    </select>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else {
                const filteredUsers = filterPenggunaByRole(targetRole);
                if (targetRole.toLowerCase().includes('wali asuh') || targetRole.toLowerCase().includes('wali asrama')) {
                    // Wali Asuh / Wali Asrama menandatangani atas nama sendiri (tanpa memilih pengguna)
                    html = `
                        <p class="text-xs text-slate-600 mb-2">Anda akan menandatangani sebagai: <b class="text-slate-900">${targetRole}</b></p>
                        <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                            <p class="font-semibold text-slate-900">${state.user.nama}</p>
                            <p class="text-slate-500 mt-0.5">NIP: ${state.user.nip}</p>
                            <p class="text-slate-500 mt-0.5">${tugasSource(state.user) || 'Wali Asuh'}</p>
                        </div>
                        <p class="text-[11px] text-slate-400 mt-2">Dokumen akan ditandatangani atas nama Anda sendiri.</p>
                        <input type="hidden" id="nonAdminRole" value="${targetRole}">
                    `;
                } else html = `
                    <p class="text-xs text-slate-600 mb-2">Anda akan menandatangani sebagai: <b class="text-slate-900">${targetRole}</b></p>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Konfirmasi Nama Penandatangan</label>
                        <select id="signUserDropdown" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs">
                            ${filteredUsers.map(u => `<option value="${u.nip}" ${u.nip === state.user.nip ? 'selected' : ''} data-nama="${u.nama}">${u.nama} (${tugasSource(u) || 'Pegawai'}) - NIP: ${u.nip}</option>`).join('')}
                        </select>
                        <input type="hidden" id="nonAdminRole" value="${targetRole}">
                    </div>
                `;
            }

            document.getElementById('signModalContent').innerHTML = html;
            document.getElementById('signModal').classList.remove('hidden');
            document.getElementById('signModal').classList.add('flex');
        }

        function closeSignModal() {
            document.getElementById('signModal').classList.remove('flex');
            document.getElementById('signModal').classList.add('hidden');
        }

        function triggerSignConfirmation() {
            const izinCek = state.perizinanSiswa.find(p => p.idIzin === activeSignIdIzin);
            if (!userCanSignIzin(izinCek, state.user)) {
                closeSignModal();
                showToast("Anda tidak berwenang menandatangani dokumen ini.", true);
                return;
            }
            let selectedAdminRoles = [];
            const adminChoices = {};
            let singleSignerNip = state.user.nip;
            let singleSignerName = state.user.nama;

            if (state.user.isAdmin) {
                const checkboxes = document.querySelectorAll('input[name="adminRoleCheckbox"]:checked');
                checkboxes.forEach(cb => selectedAdminRoles.push(cb.value));
                document.querySelectorAll('select[data-admin-signer]').forEach(sel => {
                    const opt = sel.selectedIndex >= 0 ? sel.options[sel.selectedIndex] : null;
                    adminChoices[sel.getAttribute('data-admin-signer')] = {
                        nip: sel.value,
                        nama: opt ? opt.getAttribute('data-nama') : ''
                    };
                });
            } else {
                let nonAdminRoleEl = document.getElementById('nonAdminRole');
                if (nonAdminRoleEl) selectedAdminRoles.push(nonAdminRoleEl.value);
                const selectUserEl = document.getElementById('signUserDropdown');
                if (selectUserEl) {
                    singleSignerNip = selectUserEl.value;
                    singleSignerName = selectUserEl.selectedIndex >= 0 ? selectUserEl.options[selectUserEl.selectedIndex].getAttribute('data-nama') : state.user.nama;
                }
            }

            if (selectedAdminRoles.length === 0) {
                showToast("Pilih minimal 1 peran penandatangan!", true);
                return;
            }

            closeSignModal();

            showCustomConfirm("Apakah Anda yakin ingin menandatangani perizinan ini untuk peran yang dipilih?", async () => {
                if (!activeSignIdIzin) return;
                const idIzin = activeSignIdIzin;

                showLoading("Memproses tanda tangan...");
                try {
                    let izin = state.perizinanSiswa.find(p => p.idIzin === idIzin);
                    if (!izin) throw new Error("Data tidak ditemukan");

                    let sigs = JSON.parse(JSON.stringify(izin.signatures || {}));
                    const siswaObj = state.siswa.find(s => s.nisn === String(izin.nisn)) || {};
                    const kelasSiswa = siswaObj.kelas || izin.kelas || '';
                    const rombelSiswa = siswaObj.rombel || izin.rombel || '';
                    const kelasRombelStr = kelasSiswa && rombelSiswa ? `${kelasSiswa}-${rombelSiswa}`.toLowerCase() : '';

                    const unmatchedRoles = [];
                    selectedAdminRoles.forEach(roleName => {
                        let signName = singleSignerName;
                        let signNip = singleSignerNip;
                        let signJabatan = roleName;

                        if (state.user.isAdmin) {
                            const choice = adminChoices[roleName];
                            const chosenUser = (choice && choice.nip && choice.nip !== '__self__') ? findPenggunaByNip(choice.nip) : null;
                            if (chosenUser) {
                                signName = chosenUser.nama;
                                signNip = chosenUser.nip;
                                signJabatan = findRoleSegment(chosenUser, roleName, kelasSiswa, rombelSiswa) || tugasSource(chosenUser) || roleName;
                            } else {
                                // Atas nama admin sendiri: jabatan dicatat apa adanya (bukan nama peran)
                                signName = state.user.nama;
                                signNip = state.user.nip;
                                signJabatan = tugasSource(state.user) || 'Administrator';
                                if (!state.penggunaList.some(u => userMatchesRole(u, roleName, kelasSiswa, rombelSiswa))) unmatchedRoles.push(roleName);
                            }
                        } else {
                            const signerUser = findPenggunaByNip(signNip);
                            signJabatan = findRoleSegment(signerUser, roleName, kelasSiswa, rombelSiswa)
                                || tugasSource(signerUser) || roleName;
                        }

                        sigs[roleName] = { nama: signName, nip: signNip, jabatan: signJabatan, status: 'Disetujui' };
                    });

                    let allSigned = Object.values(sigs).length > 0 && Object.values(sigs).every(s => s.status === 'Disetujui');
                    let updateData = { 
                        signatures: sigs,
                        status: allSigned ? 'Aktif' : 'Pending'
                    };

                    const { error } = await supabaseClient.from('perizinan_siswa').update(updateData).eq('id_izin', idIzin);
                    if (error) throw new Error(error.message);

                    showToast(unmatchedRoles.length
                        ? "Tersimpan. Tidak ada pegawai terdaftar untuk peran: " + unmatchedRoles.join(', ') + " (ditandatangani atas nama Anda)."
                        : "Berhasil menandatangani perizinan!", unmatchedRoles.length > 0);
                    await fetchAppData();
                } catch (err) {
                    console.error(err);
                    showToast("Gagal menandatangani: " + err.message, true);
                } finally {
                    hideLoading();
                }
            });
        }

        // --- RETURN / PENYELESAIAN SISWA DENGAN MODAL ---
        // --- PILIHAN PENGANTAR (dropdown + pencarian) ---
        let returnPengantar = { mode: 'none', nip: '', nama: '', jabatan: '' };
        let pengantarCandidates = [];

        function getPengantarCandidates(q) {
            const query = String(q || '').trim().toLowerCase();
            return (state.penggunaList || [])
                .map(u => ({ nip: String(u.nip), nama: u.nama || '', jabatan: tugasSource(u) || 'Pegawai' }))
                .filter(c => !query || c.nama.toLowerCase().includes(query) || c.jabatan.toLowerCase().includes(query))
                .sort((x, y) => x.jabatan.localeCompare(y.jabatan, 'id', { numeric: true }) || x.nama.localeCompare(y.nama, 'id'));
        }

        function renderPengantarOptions() {
            const box = document.getElementById('pengantarOptionList');
            if (!box) return;
            const q = document.getElementById('pengantarSearchInput').value;
            pengantarCandidates = getPengantarCandidates(q);
            const items = pengantarCandidates.map((c, i) => `
                <button type="button" onclick="selectPengantar(${i})" class="w-full text-left px-3 py-2 text-xs hover:bg-orange-50 border-b border-slate-50 ${returnPengantar.mode === 'pegawai' && returnPengantar.nip === c.nip ? 'bg-orange-50 font-semibold' : ''}">
                    ${escapeAttr(c.jabatan)} - ${escapeAttr(c.nama)}
                </button>
            `).join('');
            const empty = pengantarCandidates.length === 0 ? '<p class="px-3 py-3 text-xs text-slate-400 text-center">Tidak ada pegawai yang cocok.</p>' : '';
            box.innerHTML = items + empty + `
                <button type="button" onclick="selectPengantarLainnya()" class="w-full text-left px-3 py-2.5 text-xs font-semibold text-orange-600 hover:bg-orange-50 bg-slate-50 sticky bottom-0 ${returnPengantar.mode === 'lainnya' ? 'bg-orange-50' : ''}">
                    <i class="fa-solid fa-user-plus mr-1"></i> Lainnya (pengantar tidak ada dalam daftar)
                </button>
            `;
        }

        function updatePengantarLabel() {
            const label = document.getElementById('pengantarPickerLabel');
            const picker = document.getElementById('pengantarPicker');
            const manual = document.getElementById('pengantarManualBox');
            const m = returnPengantar.mode;
            let text = 'Pilih pengantar...', filled = false;
            if (m === 'saya') { text = `${returnPengantar.jabatan} - ${returnPengantar.nama} (Anda)`; filled = true; }
            else if (m === 'pegawai') { text = `${returnPengantar.jabatan} - ${returnPengantar.nama}`; filled = true; }
            else if (m === 'lainnya') { text = 'Lainnya (ketik manual)'; filled = true; }
            if (label) {
                label.innerText = text;
                label.className = 'truncate ' + (filled ? 'text-slate-800' : 'text-slate-400');
            }
            if (picker) {
                if (m === 'saya') picker.classList.add('opacity-50', 'pointer-events-none');
                else picker.classList.remove('opacity-50', 'pointer-events-none');
            }
            if (manual) {
                if (m === 'lainnya') manual.classList.remove('hidden');
                else manual.classList.add('hidden');
            }
        }

        function closePengantarDropdown() {
            const dd = document.getElementById('pengantarDropdown');
            if (dd) dd.classList.add('hidden');
        }

        function togglePengantarDropdown() {
            const dd = document.getElementById('pengantarDropdown');
            if (!dd) return;
            const willOpen = dd.classList.contains('hidden');
            if (willOpen) {
                dd.classList.remove('hidden');
                const search = document.getElementById('pengantarSearchInput');
                search.value = '';
                renderPengantarOptions();
                if (search.focus) search.focus();
            } else {
                dd.classList.add('hidden');
            }
        }

        function selectPengantar(i) {
            const c = pengantarCandidates[i];
            if (!c) return;
            returnPengantar = { mode: 'pegawai', nip: c.nip, nama: c.nama, jabatan: c.jabatan };
            closePengantarDropdown();
            updatePengantarLabel();
        }

        function selectPengantarLainnya() {
            returnPengantar = { mode: 'lainnya', nip: '', nama: '', jabatan: '' };
            closePengantarDropdown();
            updatePengantarLabel();
            const nm = document.getElementById('pengantarManualName');
            if (nm && nm.focus) nm.focus();
        }

        function onPengantarSelfToggle() {
            const checked = document.getElementById('pengantarSelfCheck').checked;
            closePengantarDropdown();
            if (checked) {
                returnPengantar = { mode: 'saya', nip: String(state.user.nip), nama: state.user.nama, jabatan: tugasSource(state.user) || 'Pegawai' };
            } else {
                returnPengantar = { mode: 'none', nip: '', nama: '', jabatan: '' };
            }
            updatePengantarLabel();
        }

        // Klik di luar pilihan pengantar menutup dropdown
        function handleReturnModalClick(ev) {
            const t = ev && ev.target;
            if (t && t.closest && !t.closest('#pengantarPicker')) closePengantarDropdown();
        }

        // Menghasilkan data pengantar dari pilihan pengguna (atau pesan kesalahan)
        function resolvePengantarSelection() {
            const m = returnPengantar.mode;
            if (m === 'saya' || m === 'pegawai') {
                return { ok: true, data: { pengantar: returnPengantar.nama, pengantar_tipe: 'pegawai', pengantar_jabatan: returnPengantar.jabatan, pengantar_nip: returnPengantar.nip } };
            }
            if (m === 'lainnya') {
                const nama = (document.getElementById('pengantarManualName').value || '').trim();
                const hubungan = (document.getElementById('pengantarManualRelasi').value || '').trim();
                if (!nama) return { ok: false, error: 'Nama pengantar harus diisi.' };
                if (!hubungan) return { ok: false, error: 'Hubungan dengan siswa harus diisi.' };
                return { ok: true, data: { pengantar: nama, pengantar_tipe: 'lainnya', pengantar_hubungan: hubungan } };
            }
            return { ok: false, error: 'Pengantar harus dipilih.' };
        }

        function openReturnInputModalHandler(idIzin) {
            activeReturnIdIzin = idIzin;
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            document.getElementById('returnDateInput').value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
            document.getElementById('returnTimeInput').value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
            document.getElementById('returnCatatanInput').value = '';
            // reset pilihan pengantar
            returnPengantar = { mode: 'none', nip: '', nama: '', jabatan: '' };
            document.getElementById('pengantarSelfCheck').checked = false;
            document.getElementById('pengantarSearchInput').value = '';
            document.getElementById('pengantarManualName').value = '';
            document.getElementById('pengantarManualRelasi').value = '';
            closePengantarDropdown();
            updatePengantarLabel();

            document.getElementById('returnInputModal').classList.remove('hidden');
            document.getElementById('returnInputModal').classList.add('flex');
        }

        function closeReturnInputModal() {
            document.getElementById('returnInputModal').classList.remove('flex');
            document.getElementById('returnInputModal').classList.add('hidden');
            activeReturnIdIzin = null;
        }

        async function submitStudentReturn() {
            const dateVal = document.getElementById('returnDateInput').value;
            const timeVal = document.getElementById('returnTimeInput').value;
            const catatan = document.getElementById('returnCatatanInput').value.trim();

            if (!dateVal || !timeVal) {
                showToast("Tanggal dan jam kembali harus diisi!", true);
                return;
            }
            const pengantarRes = resolvePengantarSelection();
            if (!pengantarRes.ok) {
                showToast(pengantarRes.error, true);
                return;
            }

            const idIzin = activeReturnIdIzin;
            closeReturnInputModal();

            showCustomConfirm("Apakah Anda yakin ingin menyelesaikan perizinan dan mencatat siswa kembali?", async () => {
                showLoading("Memproses waktu kembali...");
                try {
                    const realisasiStr = `${dateVal} ${timeVal}`;
                    const returnDetails = { ...pengantarRes.data, catatan };
                    const receiverInfo = {
                        nama: state.user.nama,
                        nip: state.user.nip,
                        tugas: tugasSource(state.user) || 'Pegawai'
                    };

                    const { error } = await supabaseClient.from('perizinan_siswa').update({ 
                        realisasi: realisasiStr, 
                        pengantar: pengantarRes.data.pengantar,
                        catatan: catatan || null,
                        return_details: returnDetails,
                        receiver_info: receiverInfo,
                        status: 'Selesai' 
                    }).eq('id_izin', idIzin);

                    if (error) throw new Error(error.message);

                    showToast("Siswa dicatat telah kembali.");
                    await fetchAppData();
                } catch (err) {
                    console.error(err);
                    showToast("Gagal memperbarui status: " + err.message, true);
                } finally {
                    hideLoading(); // Memastikan overlay loading selalu tertutup
                }
            });
        }

        async function deletePerizinan(idIzin) {
            showCustomConfirm("Apakah Anda yakin ingin menghapus data perizinan ini?", async () => {
                showLoading("Menghapus perizinan...");
                try {
                    const { error } = await supabaseClient.from('perizinan_siswa').delete().eq('id_izin', idIzin);
                    if (error) throw new Error(error.message);
                    showToast("Data perizinan berhasil dihapus.");
                    await fetchAppData();
                } catch (err) {
                    console.error(err);
                    showToast("Gagal menghapus data: " + err.message, true);
                } finally {
                    hideLoading();
                }
            });
        }

                        <p class="text-[10px] text-slate-700 mt-1">Jl. Erlangga Selatan No. 17 Kota Pasuruan, Prov. Jawa Timur 67115</p>
                    </div>

        function getFilteredLoans() {
            let loans = state.transaksi.filter(t => {
                let isJenisPinjam = (t.jenis || '').toLowerCase().includes('pinjam');

            let query = (state.historySearchQuery || '').toLowerCase().trim();

                loans = loans.filter(t => 
                    t.idTransaksi.toLowerCase().includes(query) ||
                    t.namaPengguna.toLowerCase().includes(query) ||
                    t.namaBarang.toLowerCase().includes(query) ||
                    t.status.toLowerCase().includes(query)
                );
            }
            return loans;
        }

        // 5. CETAK LAPORAN
        function getReportFilteredData() {
            let qBarang = (state.reportBarangQuery || '').toLowerCase().trim();
            if (state.reportJenisLaporan === 'keluar') {
                return state.transaksi.filter(t => {
                    let matchDate = (!state.reportStartDate || t.tanggal >= state.reportStartDate) &&
                                    (!state.reportEndDate || t.tanggal <= state.reportEndDate);
                    let matchBarang = !qBarang || 
                                      t.idBarang.toLowerCase().includes(qBarang) || 
                                      t.namaBarang.toLowerCase().includes(qBarang);
                    let matchJenisTrx = (state.reportJenisTrx === 'semua' || (t.jenis || '').toLowerCase().includes(state.reportJenisTrx.toLowerCase()));
                    return matchDate && matchBarang && matchJenisTrx;
                });
            } else {
                return state.masuk.filter(m => {
                    let matchDate = (!state.reportStartDate || m.tanggal >= state.reportStartDate) &&
                                    (!state.reportEndDate || m.tanggal <= state.reportEndDate);
                    let matchBarang = !qBarang || 
                                      m.idBarang.toLowerCase().includes(qBarang) || 
                                      m.namaBarang.toLowerCase().includes(qBarang);
                    return matchDate && matchBarang;
                });
            }
        }

        async function submitAddStock() {
            let existingItems = [];
            for (let id in state.addStockCart) {
                if (state.addStockCart[id] > 0) {
                    existingItems.push({ id: id, addQty: state.addStockCart[id] });
                }
            }

            let validNewItems = state.newItemList.filter(item => item.nama && item.nama.trim() !== '');

            if (existingItems.length === 0 && validNewItems.length === 0) {
                showToast("Isi penambahan stok atau lengkapi nama barang baru!", true);
                return;
            }

            showLoading("Menyimpan penambahan stok & log...");
            try {
                const now = new Date();
                const year = String(now.getFullYear()).slice(-2);
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const datePrefix = year + month + day;

                const { count } = await supabaseClient
                    .from('masuk')
                    .select('*', { count: 'exact', head: true })
                    .like('id_input', `M-${datePrefix}%`);

                let seq = (count || 0) + 1;
                let logMasukPayload = [];

                for (let item of existingItems) {
                    let targetBarang = state.barang.find(b => b.id === item.id);
                    if (targetBarang) {
                        let newStok = targetBarang.stok + item.addQty;
                        await supabaseClient
                            .from('barang')
                            .update({ stok: newStok })
                            .eq('id_barang', item.id);

                        const idInputVal = `M-${datePrefix}${String(seq).padStart(4, '0')}`;
                        seq++;

                        logMasukPayload.push({
                            id_input: idInputVal,
                            id_barang: item.id,
                            nama_barang: targetBarang.nama,
                            jumlah: item.addQty
                        });
                    }
                }

                if (validNewItems.length > 0) {
                    let insertPayload = [];
                    for (let newItem of validNewItems) {
                        let prefix = "A";
                        if (newItem.sumber === "Persediaan") prefix = "B";
                        else if (newItem.sumber === "Media Pembelajaran") prefix = "C";
                        else if (newItem.sumber === "Aset Tetap") prefix = "D";

                        let countPrefix = state.barang.filter(b => b.id.startsWith(prefix + "-")).length;
                        let newSeq = countPrefix + 1;
                        let formattedSeq = newSeq < 10 ? ("0" + newSeq) : String(newSeq);
                        let newIdBarang = prefix + "-" + formattedSeq;

                        insertPayload.push({
                            id_barang: newIdBarang,
                            sumber_perolehan: newItem.sumber,
                            kategori: newItem.kategori,
                            nama_barang: newItem.nama.trim(),
                            stok: newItem.stok,
                            hanya_pinjam: newItem.hanyaPinjam
                        });

                        state.barang.push({ id: newIdBarang, nama: newItem.nama });

                        if (newItem.stok > 0) {
                            const idInputVal = `M-${datePrefix}${String(seq).padStart(4, '0')}`;
                            seq++;

                            logMasukPayload.push({
                                id_input: idInputVal,
                                id_barang: newIdBarang,
                                nama_barang: newItem.nama.trim(),
                                jumlah: newItem.stok
                            });
                        }
                    }

                    await supabaseClient.from('barang').insert(insertPayload);
                }

                if (logMasukPayload.length > 0) {
                    const { error: errMasuk } = await supabaseClient.from('masuk').insert(logMasukPayload);
                    if (errMasuk) {
                        console.error("Gagal mencatat log masuk:", errMasuk);
                    }
                }

                showToast("Penambahan stok & log berhasil disimpan!");
                state.addStockCart = {};
                state.newItemList = [ { nama: '', kategori: 'ATK', sumber: 'Perkantoran', stok: 0, hanyaPinjam: false } ];
                state.addStockSearchQuery = '';
                await fetchAppData();
            } catch(err) {
                console.error(err);
                showToast("Gagal menyimpan penambahan stok.", true);
            } finally {
                hideLoading();
            }
        }

        function getFilteredBarang() {

            filteredBarang.sort((a, b) => {

                    return state.sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);

                return state.sortAsc ? valA - valB : valB - valA;
            });
            return filteredBarang;

                state.sortAsc = !state.sortAsc;
            } else {
                state.sortColumn = col;
                state.sortAsc = true;
            }
            renderBarangContent();
        }

        function updateCart(id, delta, maxStok) {
            if (!state.cart[id]) state.cart[id] = 0;
            let newVal = state.cart[id] + delta;
            if (newVal < 0) newVal = 0;
            if (newVal > maxStok) newVal = maxStok;
            state.cart[id] = newVal;
            
            const btnAmbil = document.getElementById('btnAmbil');
            if (btnAmbil) {
                btnAmbil.disabled = isHanyaPinjamInCart();
            }

            const tbody = document.getElementById('barangTableBody');
            if (tbody) {
                tbody.innerHTML = renderTableRows(getFilteredBarang());
            }
        }

        function manualInputCart(id, val, maxStok) {
            let num = parseInt(val);
            if (isNaN(num) || num < 0) num = 0;
            if (num > maxStok) num = maxStok;
            state.cart[id] = num;

            const btnAmbil = document.getElementById('btnAmbil');
            if (btnAmbil) {
                btnAmbil.disabled = isHanyaPinjamInCart();
            }
        }

        let pendingJenis = '';
        function confirmAction(jenis) {
            let selectedItems = [];
            for (let id in state.cart) {
                let qty = state.cart[id];
                if (qty > 0) {
                    let item = state.barang.find(b => b.id === id);
                    if (item) selectedItems.push({ ...item, qty });
                }
            }

            if (selectedItems.length === 0) {
                showToast("Pilih minimal 1 barang terlebih dahulu!", true);
                return;
            }

            pendingJenis = jenis;
            document.getElementById('modalTypeText').innerText = `Anda akan melakukan ${jenis} untuk barang berikut:`;
            
            updateModalItemList(selectedItems, jenis);

            document.getElementById('confirmModal').classList.remove('hidden');
            document.getElementById('confirmModal').classList.add('flex');
        }

        function updateModalItemList(selectedItems, jenis) {
            const listEl = document.getElementById('modalItemList');
            if (selectedItems.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-slate-400 text-center py-2">Keranjang kosong.</p>';
                return;
            }
            listEl.innerHTML = selectedItems.map((i, idx) => `
                <div class="p-3 bg-white rounded-xl border border-slate-200 space-y-2">
                    <div class="flex justify-between items-center text-sm gap-2">
                        <span class="font-bold text-slate-800 truncate">${i.nama} <span class="text-xs text-slate-500 font-normal">(x${i.qty})</span></span>
                        <button onclick="removeFromCartModal('${i.id}')" class="text-red-500 hover:text-red-700 p-1 text-xs font-bold shrink-0" title="Hapus item ini">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                    ${jenis === 'Pinjam' ? `
                        <div class="space-y-1.5 pt-1 border-t border-slate-100">
                            <input type="text" id="modalTujuan_${i.id}" oninput="handleTujuanInput(${idx}, this.value)" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Tujuan penggunaan barang ini *">
                            ${idx === 0 && selectedItems.length > 1 ? `
                                <label class="flex items-center gap-2 cursor-pointer pt-0.5">
                                    <input type="checkbox" id="applyAllCheckbox" onchange="handleApplyAllTujuan(this.checked, '${i.id}')" class="w-3.5 h-3.5 text-orange-500 rounded border-slate-300 focus:ring-orange-500">
                                    <span class="text-[11px] font-medium text-slate-600">Gunakan tujuan yang sama untuk barang lainnya</span>
                                </label>
                            ` : ''}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function handleTujuanInput(idx, val) {
            if (idx === 0) {
                const applyAllCb = document.getElementById('applyAllCheckbox');
                if (applyAllCb && applyAllCb.checked) {
                    applyToAllTujuanFields(val);
                }
            }
        }

        function handleApplyAllTujuan(isChecked, firstId) {
            if (isChecked) {
                const firstInput = document.getElementById(`modalTujuan_${firstId}`);
                if (firstInput) {
                    applyToAllTujuanFields(firstInput.value);
                }
            }
        }

        function applyToAllTujuanFields(val) {
            for (let id in state.cart) {
                if (state.cart[id] > 0) {
                    const inputEl = document.getElementById(`modalTujuan_${id}`);
                    if (inputEl) {
                        inputEl.value = val;
                    }
                }
            }
        }

        function removeFromCartModal(id) {
            delete state.cart[id];
            let selectedItems = [];
            for (let cartId in state.cart) {
                let qty = state.cart[cartId];
                if (qty > 0) {
                    let item = state.barang.find(b => b.id === cartId);
                    if (item) selectedItems.push({ ...item, qty });
                }
            }

            if (selectedItems.length === 0) {
                closeConfirmModal();
                renderBarangContent();
                showToast("Semua item dihapus dari pilihan.", true);
                return;
            }

            updateModalItemList(selectedItems, pendingJenis);
            const tbody = document.getElementById('barangTableBody');
            if (tbody) tbody.innerHTML = renderTableRows(getFilteredBarang());
